<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FUTFRALDA · Copinha FIFA 26</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7faf5;
      --panel: #ffffff;
      --panel-soft: #f1f7f1;
      --ink: #17332a;
      --muted: #66756e;
      --line: #dfe8df;
      --grass: #48a868;
      --grass-dark: #1f7b49;
      --grass-soft: #dff2e5;
      --pink: #f7b8ce;
      --pink-soft: #fdeaf1;
      --blue: #a8daf4;
      --blue-soft: #e8f6fd;
      --yellow: #f6c75c;
      --danger: #e66967;
      --shadow: 0 18px 44px rgba(24, 58, 43, .11);
      --shadow-soft: 0 10px 28px rgba(24, 58, 43, .08);
      --radius: 18px;
      --radius-sm: 12px;
      --font-display: "Baloo 2", "Fredoka", "Nunito", system-ui, sans-serif;
      --font-body: "Inter", "Nunito", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      min-height: 100%;
      margin: 0;
      color: var(--ink);
      font-family: var(--font-body);
      background:
        radial-gradient(circle at top left, rgba(168, 218, 244, .45), transparent 28rem),
        radial-gradient(circle at 88% 0, rgba(247, 184, 206, .42), transparent 24rem),
        linear-gradient(180deg, #fbfdf9 0%, var(--bg) 46%, #eff7f0 100%);
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
    }

    .app-shell {
      width: min(1320px, calc(100% - 28px));
      margin: 0 auto;
      padding: 18px 0 34px;
    }

    .hero {
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: center;
      min-height: 180px;
      padding: clamp(22px, 4vw, 40px);
      border: 1px solid rgba(72, 168, 104, .24);
      border-radius: 28px;
      background:
        linear-gradient(90deg, rgba(255, 255, 255, .9), rgba(255, 255, 255, .68)),
        linear-gradient(135deg, rgba(72, 168, 104, .18), rgba(168, 218, 244, .28) 58%, rgba(247, 184, 206, .25));
      box-shadow: var(--shadow);
    }

    .hero::before,
    .hero::after {
      content: "";
      position: absolute;
      pointer-events: none;
      border-color: rgba(31, 123, 73, .17);
      border-style: solid;
    }

    .hero::before {
      inset: 22px;
      border-width: 2px;
      border-radius: 24px;
    }

    .hero::after {
      width: 132px;
      height: 132px;
      right: 13%;
      top: 50%;
      transform: translateY(-50%);
      border-width: 2px;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent 49%, rgba(31, 123, 73, .16) 50%, transparent 51%);
    }

    .hero-content,
    .top-actions {
      position: relative;
      z-index: 1;
    }

    .hero h1 {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(2.35rem, 6.5vw, 5.8rem);
      line-height: .92;
      letter-spacing: 0;
    }

    .hero-subtitle {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.22rem);
      font-weight: 700;
    }

    .hero-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 34px;
      padding: 6px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, .82);
      color: var(--ink);
      font-size: .88rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .pill.good {
      border-color: rgba(72, 168, 104, .35);
      background: var(--grass-soft);
      color: var(--grass-dark);
    }

    .pill.warn {
      border-color: rgba(246, 199, 92, .55);
      background: #fff6d8;
      color: #7b5609;
    }

    .pill.pink {
      border-color: rgba(247, 184, 206, .7);
      background: var(--pink-soft);
    }

    .pill.blue {
      border-color: rgba(168, 218, 244, .9);
      background: var(--blue-soft);
    }

    .top-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px;
      max-width: 360px;
    }

    .tabs-wrap {
      position: sticky;
      top: 0;
      z-index: 5;
      margin: 16px 0;
      padding: 8px 0;
      background: linear-gradient(180deg, rgba(247, 250, 245, .98), rgba(247, 250, 245, .82));
      backdrop-filter: blur(14px);
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(5, minmax(120px, 1fr));
      gap: 8px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: rgba(255, 255, 255, .76);
      box-shadow: 0 8px 22px rgba(24, 58, 43, .05);
    }

    .tab {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      padding: 8px 12px;
      border-radius: 14px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      font-weight: 900;
      transition: transform .18s ease, background .18s ease, color .18s ease, box-shadow .18s ease;
    }

    .tab:hover {
      transform: translateY(-1px);
      background: #f3f8f1;
      color: var(--ink);
    }

    .tab.active {
      color: #ffffff;
      background: linear-gradient(135deg, var(--grass-dark), var(--grass));
      box-shadow: 0 10px 22px rgba(31, 123, 73, .22);
    }

    .section {
      display: grid;
      gap: 16px;
      animation: fadeUp .22s ease both;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .grid-2 {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, .42fr);
      gap: 16px;
      align-items: start;
    }

    .card,
    .empty-state,
    .notice {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, .88);
      box-shadow: var(--shadow-soft);
    }

    .card {
      overflow: hidden;
      transition: transform .18s ease, box-shadow .18s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }

    .card-head,
    .card-body {
      padding: 18px;
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(90deg, rgba(223, 242, 229, .66), rgba(232, 246, 253, .46));
    }

    .card-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(1.22rem, 2.4vw, 1.65rem);
      line-height: 1;
      letter-spacing: 0;
    }

    .card-kicker {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: .9rem;
      font-weight: 700;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .form-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
    }

    .input,
    .textarea {
      width: 100%;
      min-height: 44px;
      border: 1px solid #ccd9cf;
      border-radius: 14px;
      background: #ffffff;
      color: var(--ink);
      outline: 0;
      padding: 10px 12px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .8);
      transition: border-color .18s ease, box-shadow .18s ease;
    }

    .input:focus,
    .textarea:focus {
      border-color: var(--grass);
      box-shadow: 0 0 0 4px rgba(72, 168, 104, .15);
    }

    .textarea {
      min-height: 280px;
      resize: vertical;
      line-height: 1.5;
    }

    .input:disabled,
    .textarea:disabled {
      color: #7a837e;
      background: #f2f5f1;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 42px;
      padding: 9px 14px;
      border-radius: 14px;
      color: var(--ink);
      background: #eef5ee;
      border: 1px solid rgba(31, 123, 73, .12);
      cursor: pointer;
      font-weight: 900;
      text-decoration: none;
      white-space: nowrap;
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease, opacity .18s ease;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(24, 58, 43, .11);
    }

    .btn:disabled {
      cursor: not-allowed;
      opacity: .55;
    }

    .btn.primary {
      color: #ffffff;
      background: linear-gradient(135deg, var(--grass-dark), var(--grass));
      box-shadow: 0 11px 24px rgba(31, 123, 73, .22);
    }

    .btn.blue {
      background: var(--blue-soft);
      border-color: rgba(66, 151, 194, .26);
    }

    .btn.pink {
      background: var(--pink-soft);
      border-color: rgba(203, 90, 130, .2);
    }

    .btn.danger {
      color: #9f2e2c;
      background: #fff0ef;
      border-color: rgba(230, 105, 103, .28);
    }

    .btn.icon {
      width: 42px;
      padding: 0;
    }

    .player-list,
    .assignment-grid,
    .team-pool,
    .match-list,
    .qualifier-grid {
      display: grid;
      gap: 10px;
    }

    .player-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 10px;
      align-items: center;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #ffffff;
    }

    .restricted-toggle {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 40px;
      padding: 8px 10px;
      border: 1px solid rgba(246, 199, 92, .54);
      border-radius: 999px;
      background: #fff9e6;
      font-size: .86rem;
      font-weight: 900;
      white-space: nowrap;
      cursor: pointer;
    }

    .restricted-toggle input {
      width: 17px;
      height: 17px;
      accent-color: var(--yellow);
    }

    .restricted-toggle.disabled {
      cursor: default;
      opacity: .72;
    }

    .small-note {
      color: var(--muted);
      font-size: .9rem;
      line-height: 1.45;
    }

    .notice,
    .empty-state {
      padding: 16px;
    }

    .notice {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      background: linear-gradient(135deg, rgba(255, 246, 216, .9), rgba(255, 255, 255, .86));
    }

    .notice.good {
      background: linear-gradient(135deg, rgba(223, 242, 229, .95), rgba(255, 255, 255, .88));
    }

    .notice.danger {
      background: linear-gradient(135deg, rgba(255, 240, 239, .95), rgba(255, 255, 255, .88));
    }

    .notice strong {
      display: block;
      margin-bottom: 3px;
    }

    .empty-state {
      display: grid;
      place-items: center;
      min-height: 180px;
      text-align: center;
      color: var(--muted);
      background:
        linear-gradient(135deg, rgba(223, 242, 229, .54), rgba(232, 246, 253, .45)),
        #ffffff;
    }

    .empty-state .big {
      display: block;
      margin-bottom: 8px;
      font-size: 2rem;
    }

    .team-card,
    .assignment-card,
    .qualifier-card {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 70px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #ffffff;
    }

    .assignment-grid {
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    }

    .assignment-card {
      position: relative;
      overflow: hidden;
      transform-style: preserve-3d;
    }

    .assignment-card.revealed {
      animation: revealCard .35s ease both;
    }

    .assignment-card.hidden-card {
      min-height: 86px;
      justify-content: center;
      color: var(--grass-dark);
      background:
        linear-gradient(135deg, rgba(223, 242, 229, .95), rgba(232, 246, 253, .95));
    }

    @keyframes revealCard {
      from {
        opacity: 0;
        transform: rotateY(18deg) translateY(8px);
      }
      to {
        opacity: 1;
        transform: rotateY(0) translateY(0);
      }
    }

    .team-pool {
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    }

    .team-card {
      min-height: 58px;
    }

    .team-card.forbidden {
      background: #fff4f3;
      border-color: rgba(230, 105, 103, .25);
    }

    .team-mark {
      flex: 0 0 auto;
      display: inline-grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      font-weight: 950;
      letter-spacing: 0;
      box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .68), 0 8px 18px rgba(24, 58, 43, .12);
    }

    .team-mark.flag {
      font-size: 1.8rem;
      background: #f3f7f1;
    }

    .team-mark.club {
      color: #ffffff;
      font-size: .73rem;
      background: linear-gradient(135deg, var(--c1), var(--c2));
      text-shadow: 0 1px 2px rgba(0, 0, 0, .28);
    }

    .team-meta {
      min-width: 0;
    }

    .team-meta strong {
      display: block;
      overflow-wrap: anywhere;
    }

    .team-meta span {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: .84rem;
      font-weight: 750;
    }

    .progress-wrap {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }

    .progress-bar {
      overflow: hidden;
      height: 12px;
      border-radius: 999px;
      background: #e7efe6;
    }

    .progress-fill {
      width: var(--value);
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--grass), var(--blue), var(--pink));
      transition: width .24s ease;
    }

    .group-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 16px;
      align-items: start;
    }

    .group-card {
      min-width: 0;
    }

    .table-scroll {
      overflow-x: auto;
      padding: 0 0 2px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 620px;
      font-size: .9rem;
    }

    th,
    td {
      padding: 9px 8px;
      border-bottom: 1px solid var(--line);
      text-align: center;
      white-space: nowrap;
    }

    th {
      color: #39534a;
      background: #edf6ed;
      font-size: .78rem;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    td.name-cell,
    th.name-cell {
      text-align: left;
      min-width: 170px;
    }

    tbody tr:nth-child(even) {
      background: #fbfdfb;
    }

    tr.qualified {
      background: rgba(223, 242, 229, .72);
      box-shadow: inset 4px 0 0 var(--grass);
    }

    tr.third-qualified {
      background: rgba(232, 246, 253, .86);
      box-shadow: inset 4px 0 0 #4c9bc0;
    }

    .standing-player {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      font-weight: 900;
    }

    .standing-player .team-mark {
      width: 30px;
      height: 30px;
      font-size: .64rem;
    }

    .standing-player .team-mark.flag {
      font-size: 1.28rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 24px;
      padding: 4px 8px;
      border-radius: 999px;
      background: #eef5ee;
      color: var(--muted);
      font-size: .74rem;
      font-weight: 950;
    }

    .badge.classified {
      color: var(--grass-dark);
      background: var(--grass-soft);
    }

    .badge.warning {
      color: #76500a;
      background: #fff1c6;
    }

    .badge.done {
      color: var(--grass-dark);
      background: var(--grass-soft);
    }

    .match-list {
      margin-top: 14px;
    }

    .match-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      min-height: 78px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #ffffff;
    }

    .match-card.done {
      border-color: rgba(72, 168, 104, .36);
      background: linear-gradient(135deg, rgba(223, 242, 229, .56), #ffffff);
    }

    .match-side {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .match-side.right {
      flex-direction: row-reverse;
      text-align: right;
    }

    .match-side .team-mark {
      width: 34px;
      height: 34px;
      font-size: .63rem;
    }

    .match-side .team-mark.flag {
      font-size: 1.35rem;
    }

    .match-name {
      min-width: 0;
      font-weight: 950;
      overflow-wrap: anywhere;
    }

    .match-team {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: .78rem;
      font-weight: 800;
    }

    .score-box {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px;
      border-radius: 999px;
      background: #f3f8f2;
    }

    .score-input {
      width: 52px;
      height: 40px;
      border: 1px solid #ccd9cf;
      border-radius: 12px;
      text-align: center;
      font-weight: 950;
      color: var(--ink);
      background: #ffffff;
    }

    .score-input:focus {
      outline: 0;
      border-color: var(--grass);
      box-shadow: 0 0 0 3px rgba(72, 168, 104, .15);
    }

    .score-dash {
      color: var(--muted);
      font-weight: 950;
    }

    .section-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
    }

    .section-actions > div {
      min-width: 0;
    }

    .qualifier-grid {
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    }

    .qualifier-card {
      align-items: flex-start;
    }

    .bracket {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(280px, 1fr);
      gap: 16px;
      overflow-x: auto;
      padding: 2px 0 10px;
    }

    .round {
      display: grid;
      align-content: start;
      gap: 12px;
      min-width: 280px;
    }

    .round-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: 1.28rem;
    }

    .ko-match {
      display: grid;
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #ffffff;
      box-shadow: var(--shadow-soft);
    }

    .ko-match.done {
      border-color: rgba(72, 168, 104, .36);
      background: linear-gradient(145deg, rgba(223, 242, 229, .6), #ffffff);
    }

    .ko-player {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto auto;
      gap: 8px;
      align-items: center;
      min-height: 40px;
    }

    .ko-player .team-mark {
      width: 34px;
      height: 34px;
      font-size: .6rem;
    }

    .ko-player .team-mark.flag {
      font-size: 1.32rem;
    }

    .ko-name {
      min-width: 0;
      font-weight: 950;
      overflow-wrap: anywhere;
    }

    .ko-seed {
      color: var(--muted);
      font-size: .75rem;
      font-weight: 850;
    }

    .penalty-input {
      width: 42px;
      height: 34px;
      border: 1px solid #d6ded7;
      border-radius: 10px;
      text-align: center;
      font-size: .86rem;
      font-weight: 950;
      background: #f8fbf7;
    }

    .winner-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 30px;
      color: var(--grass-dark);
      font-size: .86rem;
      font-weight: 950;
    }

    .champion {
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 18px;
      align-items: center;
      padding: clamp(20px, 4vw, 34px);
      border: 1px solid rgba(246, 199, 92, .7);
      border-radius: 28px;
      background:
        linear-gradient(135deg, rgba(255, 246, 216, .9), rgba(255, 255, 255, .82)),
        linear-gradient(90deg, var(--pink-soft), var(--blue-soft));
      box-shadow: var(--shadow);
    }

    .champion h2 {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(2rem, 5vw, 4.2rem);
      line-height: .96;
    }

    .champion p {
      margin: 8px 0 0;
      color: var(--muted);
      font-weight: 800;
    }

    .champion-cup {
      display: grid;
      place-items: center;
      width: clamp(80px, 16vw, 140px);
      height: clamp(80px, 16vw, 140px);
      border-radius: 50%;
      background: linear-gradient(135deg, #fff7c8, #f6c75c);
      font-size: clamp(2.6rem, 8vw, 5rem);
      box-shadow: inset 0 0 0 5px rgba(255, 255, 255, .5), 0 18px 34px rgba(120, 83, 7, .18);
    }

    .confetti {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .confetti span {
      position: absolute;
      top: -18px;
      left: var(--x);
      width: 10px;
      height: 16px;
      border-radius: 3px;
      background: var(--c);
      animation: fall var(--d) linear infinite;
      animation-delay: var(--delay);
      transform: rotate(var(--r));
    }

    @keyframes fall {
      to {
        transform: translateY(320px) rotate(calc(var(--r) + 280deg));
      }
    }

    .rules-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, .55fr);
      gap: 16px;
      align-items: start;
    }

    .rules-preview {
      min-height: 280px;
      line-height: 1.55;
    }

    .rules-preview h3 {
      margin: 14px 0 8px;
      font-family: var(--font-display);
      font-size: 1.35rem;
    }

    .rules-preview h3:first-child,
    .rules-preview p:first-child {
      margin-top: 0;
    }

    .rules-preview ul {
      margin: 8px 0;
      padding-left: 22px;
    }

    .rules-preview li {
      margin: 4px 0;
    }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 20;
      max-width: min(420px, calc(100vw - 36px));
      padding: 13px 15px;
      border: 1px solid rgba(31, 123, 73, .18);
      border-radius: 16px;
      background: rgba(255, 255, 255, .94);
      box-shadow: var(--shadow);
      color: var(--ink);
      font-weight: 850;
      animation: toastIn .2s ease both;
    }

    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 900px) {
      .hero,
      .grid-2,
      .rules-layout {
        grid-template-columns: 1fr;
      }

      .top-actions {
        justify-content: flex-start;
        max-width: none;
      }

      .tabs {
        display: flex;
        overflow-x: auto;
      }

      .tab {
        flex: 0 0 auto;
      }

      .section-actions {
        align-items: stretch;
      }

      .section-actions .toolbar {
        width: 100%;
      }
    }

    @media (max-width: 640px) {
      .app-shell {
        width: min(100% - 18px, 1320px);
        padding-top: 9px;
      }

      .hero {
        border-radius: 22px;
      }

      .hero::before,
      .hero::after {
        display: none;
      }

      .card-head {
        align-items: flex-start;
        flex-direction: column;
      }

      .form-row,
      .player-row,
      .match-card {
        grid-template-columns: 1fr;
      }

      .match-side.right {
        flex-direction: row;
        text-align: left;
      }

      .score-box {
        justify-content: center;
        border-radius: 14px;
      }

      .btn,
      .top-actions .btn {
        width: 100%;
      }

      .restricted-toggle {
        width: 100%;
        justify-content: center;
      }

      .champion {
        grid-template-columns: 1fr;
        text-align: center;
      }

      .champion-cup {
        justify-self: center;
      }
    }
  </style>

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: .2;
      background-image:
        linear-gradient(30deg, transparent 48.5%, rgba(255, 255, 255, .08) 49%, rgba(255, 255, 255, .08) 50%, transparent 50.5%),
        linear-gradient(150deg, transparent 48.5%, rgba(255, 255, 255, .06) 49%, rgba(255, 255, 255, .06) 50%, transparent 50.5%);
      background-size: 72px 124px;
      mask-image: linear-gradient(90deg, black, transparent 70%);
    }

    ::selection {
      color: #08090b;
      background: var(--grass);
    }

    button,
    input,
    textarea {
      letter-spacing: 0;
    }

    .app-shell {
      width: 100%;
      max-width: 1680px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 18px;
    }

    .app-frame {
      display: grid;
      grid-template-columns: 252px minmax(0, 1fr);
      gap: 18px;
      min-height: calc(100vh - 36px);
    }

    .side-panel {
      position: sticky;
      top: 18px;
      display: flex;
      flex-direction: column;
      align-self: start;
      min-height: calc(100vh - 36px);
      max-height: calc(100vh - 36px);
      padding: 14px;
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 8px;
      background: rgba(10, 11, 15, .66);
      box-shadow: var(--shadow);
      backdrop-filter: blur(28px) saturate(145%);
      -webkit-backdrop-filter: blur(28px) saturate(145%);

    body {
      background: #050606;
    }

    body::before {
      background:
        linear-gradient(180deg, rgba(5, 6, 6, .88), rgba(5, 6, 6, .96)),
        linear-gradient(90deg, rgba(184, 255, 56, .025), transparent 40%),
        #050606;
    }

    body::after {
      opacity: .12;
      background-image:
        linear-gradient(30deg, transparent 49%, rgba(255, 255, 255, .055) 49.5%, transparent 50%),
        linear-gradient(150deg, transparent 49%, rgba(184, 255, 56, .045) 49.5%, transparent 50%);
      mask-image: linear-gradient(90deg, black, transparent 76%);
    }

    .side-panel {
      border-color: rgba(255, 255, 255, .105);
      background:
        linear-gradient(145deg, rgba(255, 255, 255, .035), transparent 38%),
        rgba(7, 8, 8, .62);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .06),
        0 28px 80px rgba(0, 0, 0, .46);
      backdrop-filter: blur(34px) saturate(120%);
      -webkit-backdrop-filter: blur(34px) saturate(120%);
    }

    .brand-mark {
      color: #070808;
      background: var(--grass);
      box-shadow: 0 0 30px rgba(184, 255, 56, .14);
    }

    .tab {
      color: #8f9490;

      function defaultState() {
        return {
          players: [],

          groups: [],

          excludedTeams: [],

          rankingBaseIncluded: false,

      function loadState() {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (!saved) return defaultState();
          return normalizeState(JSON.parse(saved));
        } catch (error) {
          console.warn(error);
          return defaultState();
        }

      function normalizeState(input) {
        const base = defaultState();

          groups: Array.isArray(incoming.groups) ? incoming.groups : [],
          groupMatches: Array.isArray(incoming.groupMatches) ? incoming.groupMatches.map((match) => ({

            rankingBaseMatch: Boolean(match.rankingBaseMatch) || markHistoricalMatches
          })) : [],
          excludedTeams: Array.isArray(incoming.excludedTeams) ? incoming.excludedTeams.filter((teamName) => TEAM_BY_NAME.has(teamName)) : [],

          rankingBaseIncluded: Boolean(incoming.rankingBaseIncluded) || isLegacyBackup,
          rankingAdjustments: normalizeRankingAdjustments(incoming.rankingAdjustments),
          rankingEditorName: typeof incoming.rankingEditorName === "string" ? incoming.rankingEditorName : "",
          rulesText: typeof incoming.rulesText === "string" ? incoming.rulesText : "",
          activeTab: incoming.activeTab || "players"
        };
      }

      function normalizeRankingAdjustments(adjustments) {
        if (!Array.isArray(adjustments)) return [];
        return adjustments
          .map((item) => {
            const name = String(item?.name || "").trim();
            if (!name) return null;
            return RANKING_FIELDS.reduce((row, field) => {
              row[field] = Number.isFinite(Number(item[field])) ? Math.trunc(Number(item[field])) : 0;
              return row;
            }, { name });
          })
          .filter(Boolean);
      }

      function normalizeKnockoutState(knockout, markHistoricalMatches = false) {
        if (!knockout || typeof knockout !== "object") return null;
        const rounds = Array.isArray(knockout.rounds) ? knockout.rounds.map((round) => ({
          ...round,
          matches: Array.isArray(round.matches) ? round.matches.map((match) => normalizeKnockoutMatch(match, round.name, markHistoricalMatches)) : []
        })) : [];
        return { ...knockout, rounds };
      }

      function normalizeKnockoutMatch(match, roundName, markHistoricalMatches = false) {
        const normalized = match && typeof match === "object" ? { ...match } : {};
        const twoLegged = roundName === "Quartas";
        normalized.twoLegged = twoLegged || Boolean(normalized.twoLegged);
        normalized.rankingBaseMatch = Boolean(normalized.rankingBaseMatch) || markHistoricalMatches;
        if (!twoLegged || Array.isArray(normalized.legs)) return normalized;

        const hasFirstLeg = normalized.homeGoals !== null
          && normalized.homeGoals !== undefined
          && normalized.awayGoals !== null
          && normalized.awayGoals !== undefined;
        const hasSecondLeg = normalized.homePenalties !== null
          && normalized.homePenalties !== undefined
          && normalized.awayPenalties !== null
          && normalized.awayPenalties !== undefined;

        normalized.legs = [
          {
            label: "Ida",
            homeGoals: hasFirstLeg ? normalized.homeGoals : null,
            awayGoals: hasFirstLeg ? normalized.awayGoals : null
          },
          {
            label: "Volta",
            homeGoals: hasSecondLeg ? normalized.homePenalties : null,
            awayGoals: hasSecondLeg ? normalized.awayPenalties : null
          }
        ];

        if (hasSecondLeg) {
          normalized.homePenalties = null;
          normalized.awayPenalties = null;
          normalized.homeGoals = normalized.legs.reduce((sum, leg) => sum + (Number(leg.homeGoals) || 0), 0);
          normalized.awayGoals = normalized.legs.reduce((sum, leg) => sum + (Number(leg.awayGoals) || 0), 0);
        } else if (normalized.saved) {
          normalized.saved = false;
          normalized.winnerId = null;
        }

        return normalized;
      }

      function isRankingBaseBackupState(input) {
        if (!input || typeof input !== "object" || !Array.isArray(input.players)) return false;
        const names = new Map(input.players.map((player) => [player.id, player.name]));
        const groupMatches = Array.isArray(input.groupMatches) ? input.groupMatches : [];
        const quarters = input.knockout?.rounds?.find((round) => round.name === "Quartas")?.matches || [];
        const hasGroupAnchor = groupMatches.some((match) => names.get(match.homeId) === "Wsiel"
          && names.get(match.awayId) === "Deyvid"
          && Number(match.homeGoals) === 0
          && Number(match.awayGoals) === 7);
        const hasQuarterAnchor = quarters.some((match) => names.get(match.homeId) === "Pedro"
          && names.get(match.awayId) === "Gilson"
          && Number(match.homeGoals) === 0
          && Number(match.awayGoals) === 2
          && Number(match.homePenalties) === 3
          && Number(match.awayPenalties) === 4);
        return input.players.length === 18 && groupMatches.length === 32 && hasGroupAnchor && hasQuarterAnchor;
      }

      function saveState() {
        state.updatedAt = Date.now();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }

      function uid(prefix) {
        if (crypto && typeof crypto.randomUUID === "function") {
          return `${prefix}-${crypto.randomUUID()}`;
        }
        return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 9)}`;
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function shuffle(items) {
        const copy = [...items];
        for (let index = copy.length - 1; index > 0; index -= 1) {
          const swapIndex = Math.floor(Math.random() * (index + 1));
          [copy[index], copy[swapIndex]] = [copy[swapIndex], copy[index]];
        }
        return copy;
      }

      function notify(message) {
        clearTimeout(toastTimer);
        toast.textContent = message;
        toast.classList.remove("hidden");
        toastTimer = setTimeout(() => toast.classList.add("hidden"), 3300);
      }

      function playerById(playerId) {
        return state.players.find((player) => player.id === playerId) || null;
      }

      function assignmentByPlayer(playerId) {
        return state.assignments.find((assignment) => assignment.playerId === playerId) || null;
      }

      function teamForPlayer(playerId) {
        const assignment = assignmentByPlayer(playerId);
        return assignment ? TEAM_BY_NAME.get(assignment.teamName) : null;
      }

      function hasDraw() {
        return state.assignments.length > 0;
      }

      function restrictedCount() {
        return state.players.filter((player) => player.restricted).length;
      }

      function seededCount() {
        return state.players.filter((player) => player.seeded).length;
      }

      function groupSizesForCount(count = state.players.length) {
        return GROUP_SIZES[count] || null;
      }

      function requiredSeedCount() {
        const sizes = groupSizesForCount();
        return sizes ? sizes.length * 2 : 0;
      }

      function availableTeams() {
        const excluded = new Set(state.excludedTeams);
        return TEAMS.filter((team) => !excluded.has(team.name));
      }

      function canDraw() {
        const requiredSeeds = requiredSeedCount();
        return state.players.length >= 15
          && state.players.length <= 20
          && restrictedCount() === 4
          && requiredSeeds > 0
          && seededCount() === requiredSeeds
          && availableTeams().length >= state.players.length;
      }

      function allGroupMatchesComplete() {
        return state.groupMatches.length > 0 && state.groupMatches.every((match) => match.saved);
      }

      function progressValue(done, total) {
        if (!total) return "0%";
        return `${Math.round((done / total) * 100)}%`;
      }

      function teamMark(teamName) {
        const team = TEAM_BY_NAME.get(teamName);
        if (!team) {
          return `<span class="team-mark logo placeholder" aria-hidden="true">${uiIcon("shield")}</span>`;
        }
        if (!team.logo) {
          const colors = Array.isArray(team.colors) ? team.colors : ["#111", "#f4f5f0", "#b8ff38"];
          return `<span class="team-mark logo crest-fallback" style="--c1:${colors[0]};--c2:${colors[1]};--c3:${colors[2]};" aria-hidden="true"><span>${escapeHtml(team.short || team.name.slice(0, 3).toUpperCase())}</span></span>`;
        }
        return `<span class="team-mark logo" aria-hidden="true"><img src="${team.logo}" alt="" loading="lazy"></span>`;
      }

      function restrictedTeamBadge(teamName) {
        return FORBIDDEN_FOR_RESTRICTED.has(teamName) ? `<span class="restricted-flag">Restrito</span>` : "";
      }

      function playerTeamLine(playerId) {
        const player = playerById(playerId);
        const team = teamForPlayer(playerId);
        return {
          playerName: player ? player.name : "A definir",
          teamName: team ? team.name : "Sem time",
          mark: team ? teamMark(team.name) : `<span class="team-mark logo placeholder" aria-hidden="true">${uiIcon("shield")}</span>`
        };
      }

      function navIcon(id) {
        const paths = {
          players: `<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>`,
          draw: `<rect width="18" height="18" x="3" y="3" rx="2"/><path d="m16 8 2-2-2-2"/><path d="M18 6h-5a4 4 0 0 0-4 4"/><path d="m8 16-2 2 2 2"/><path d="M6 18h5a4 4 0 0 0 4-4"/>`,
          groups: `<path d="M3 3v18h18"/><path d="M7 16V9"/><path d="M12 16V5"/><path d="M17 16v-3"/>`,
          knockout: `<path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0V4Z"/><path d="M7 6H4v2a4 4 0 0 0 4 4"/><path d="M17 6h3v2a4 4 0 0 1-4 4"/>`,
          ranking: `<path d="M3 3v18h18"/><path d="m7 14 3-3 3 2 5-6"/><path d="M18 7h-4"/><path d="M18 7v4"/>`,
          rules: `<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/><path d="M8 13h8"/><path d="M8 17h8"/><path d="M8 9h2"/>`
        };
        return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[id]}</svg>`;
      }

      function uiIcon(id) {
        const paths = {
          users: `<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>`,
          plus: `<path d="M12 5v14M5 12h14"/>`,
          trash: `<path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="m19 6-1 14H6L5 6"/><path d="M10 11v5M14 11v5"/>`,
          shuffle: `<path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="m4 4 5 5"/>`,
          chart: `<path d="M3 3v18h18"/><path d="M7 16V9"/><path d="M12 16V5"/><path d="M17 16v-3"/>`,
          document: `<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h8"/>`,
          trophy: `<path d="M8 21h8M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0V4Z"/><path d="M7 6H4v2a4 4 0 0 0 4 4M17 6h3v2a4 4 0 0 1-4 4"/>`,
          shield: `<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/>`,
          check: `<path d="m5 12 4 4L19 6"/>`,
          clock: `<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>`,
          ball: `<circle cx="12" cy="12" r="9"/><path d="m9 8 3-2 3 2-1 4h-4L9 8Z"/><path d="m10 12-3 3 1 3M14 12l3 3-1 3M7 9l2-1M17 9l-2-1"/>`
        };
        return `<svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[id] || paths.shield}</svg>`;
      }

      function render() {
        const doneMatches = state.groupMatches.filter((match) => match.saved).length;
        const seedsNeeded = requiredSeedCount();
        app.innerHTML = `
          <div class="app-frame">
            <aside class="side-panel" aria-label="Painel de navegação">
              <div class="brand-lockup">
                <div class="brand-mark" aria-hidden="true">FF</div>
                <div class="brand-copy">
                  <strong>FUTFRALDA</strong>
                  <span>Copinha FC 26</span>
                </div>
              </div>
              <div class="sidebar-label">Competição</div>
              ${renderTabs()}
              <div class="sidebar-label">Resumo ao vivo</div>
              <div class="sidebar-status">
                <div class="mini-stat"><strong>${state.players.length}/20</strong><span>Jogadores</span></div>
                <div class="mini-stat"><strong>${restrictedCount()}/4</strong><span>Restritos</span></div>
                <div class="mini-stat"><strong>${seededCount()}/${seedsNeeded || 0}</strong><span>Cabeças</span></div>
                <div class="mini-stat"><strong>${doneMatches}/${state.groupMatches.length || 0}</strong><span>Jogos</span></div>
              </div>
              <div class="sidebar-actions" aria-label="Ações de arquivo">
                <button class="btn blue" type="button" data-action="export">Exportar dados</button>
                <label class="btn pink" for="importFile">Importar dados</label>
                <input id="importFile" class="hidden" type="file" accept="application/json,.json" data-action="import">
                <button class="btn danger" type="button" data-action="reset">Resetar torneio</button>
              </div>
            </aside>
            <div class="workspace">
              <header class="hero">
                <div class="hero-content">
                  <div class="eyebrow">Chá de fraldas · Luísa e Alice</div>
                  <h1>FUTFRALDA 26</h1>
                  <p class="hero-subtitle">A copinha delas.</p>
                  <div class="hero-stats">
                    <span class="pill good">${state.players.length}/20 jogadores</span>
                    <span class="pill warn">${restrictedCount()}/4 restritos</span>
                    <span class="pill blue">${seededCount()}/${seedsNeeded || 0} cabeças</span>
                    <span class="pill pink">${doneMatches}/${state.groupMatches.length || 0} jogos salvos</span>
                  </div>
                </div>
                <div class="live-chip">Painel ao vivo</div>
              </header>
              <main>
                ${renderActiveSection()}
              </main>
            </div>
          </div>
        `;
      }

      function renderTabs() {
        const tabs = [
          ["players", "Cadastro"],
          ["draw", "Sorteio"],
          ["groups", "Grupos"],
          ["knockout", "Mata-mata"],
          ["ranking", "Ranking"],
          ["rules", "Regras"]
        ];
        return `
          <div class="tabs-wrap">
            <nav class="tabs" aria-label="Seções do painel">
              ${tabs.map(([id, label]) => `
                <button class="tab ${state.activeTab === id ? "active" : ""}" type="button" data-tab="${id}" aria-label="${label}" title="${label}">
                  ${navIcon(id)}
                  <span>${label}</span>
                </button>
              `).join("")}
            </nav>
          </div>
        `;
      }

      function renderActiveSection() {
        const tab = state.activeTab;
        if (tab === "draw") return renderDraw();
        if (tab === "groups") return renderGroups();
        if (tab === "knockout") return renderKnockout();
        if (tab === "ranking") return renderRanking();
        if (tab === "rules") return renderRules();
        return renderPlayers();
      }

      function renderPlayers() {
        const locked = hasDraw();
        const count = state.players.length;
        return `
          <section class="section" aria-labelledby="playersTitle">
            <div class="players-layout">
              <article class="card">
                <div class="card-head">
                  <div>
                    <h2 id="playersTitle" class="card-title title-with-icon">${uiIcon("users")} Cadastro de Jogadores</h2>
                    <p class="card-kicker">${count}/20 jogadores confirmados</p>
                  </div>
                  <span class="pill ${count >= 15 ? "good" : "warn"}">${count >= 15 ? "Mínimo atingido" : `Faltam ${15 - count}`}</span>
                </div>
                <div class="card-body">
                  <form class="form-row" data-form="add-player">
                    <input class="input" name="playerName" type="text" placeholder="Nome do jogador" maxlength="34" ${locked || count >= 20 ? "disabled" : ""} required>
                    <button class="btn primary" type="submit" ${locked || count >= 20 ? "disabled" : ""}>${uiIcon("plus")} Adicionar</button>
                  </form>
                  ${locked ? `<p class="small-note">O cadastro fica travado depois do sorteio para proteger os resultados. Para mudar nomes ou restrições, refaça o sorteio.</p>` : ""}
                  <div class="progress-wrap">
                    <div class="progress-bar" aria-hidden="true"><div class="progress-fill" style="--value:${progressValue(count, 20)}"></div></div>
                    <div class="toolbar">
                      <span class="pill ${restrictedCount() === 4 ? "good" : "warn"}">${restrictedCount()}/4 restritos</span>
                      <span class="pill ${requiredSeedCount() && seededCount() === requiredSeedCount() ? "good" : "blue"}">${seededCount()}/${requiredSeedCount() || 0} cabeças</span>
                      <span class="pill ${count <= 20 ? "blue" : "warn"}">Máximo 20</span>
                    </div>
                  </div>
                  <div class="player-list" style="margin-top:16px;">
                    ${state.players.length ? state.players.map((player, index) => renderPlayerRow(player, index, locked)).join("") : `
                      <div class="empty-state">
                        <div><span class="empty-icon">${uiIcon("ball")}</span><strong>Adicione os participantes da copinha.</strong><br>Com 15 a 20 jogadores, o sorteio fica liberado.</div>
                      </div>
                    `}
                  </div>
                </div>
              </article>
            </div>
          </section>
        `;
      }

      function renderPlayerRow(player, index, locked) {
        return `
          <div class="player-row">
            <input class="input" type="text" value="${escapeHtml(player.name)}" maxlength="34" data-player-name="${player.id}" aria-label="Nome do jogador ${index + 1}" ${locked ? "disabled" : ""}>
            <label class="restricted-toggle ${locked ? "disabled" : ""}">
              <input type="checkbox" data-player-restricted="${player.id}" ${player.restricted ? "checked" : ""} ${locked ? "disabled" : ""}>
              <span>Restrito</span>
            </label>
            <label class="restricted-toggle ${locked ? "disabled" : ""}">
              <input type="checkbox" data-player-seeded="${player.id}" ${player.seeded ? "checked" : ""} ${locked ? "disabled" : ""}>
              <span>Cabeça</span>
            </label>
            <button class="btn icon danger" type="button" title="Remover jogador" aria-label="Remover ${escapeHtml(player.name)}" data-action="remove-player" data-player-id="${player.id}" ${locked ? "disabled" : ""}>${uiIcon("trash")}</button>
          </div>
        `;
      }

      function renderDraw() {
        const locked = hasDraw();
        const ready = canDraw();
        const available = availableTeams();
        const revealLimit = Number.isFinite(revealCount) ? revealCount : state.assignments.length;
        return `
          <section class="section" aria-labelledby="drawTitle">
            ${renderSeedSetup(locked)}
            <article class="card">
              <div class="card-head">
                <div>
                  <h2 id="drawTitle" class="card-title title-with-icon">${uiIcon("shuffle")} Sorteio de Equipes</h2>
                  <p class="card-kicker">1 time por jogador, sem repetição e respeitando os restritos.</p>
                </div>
                <div class="toolbar">
                  <button class="btn primary" type="button" data-action="draw-teams" ${ready ? "" : "disabled"}>${uiIcon("shuffle")} ${locked ? "Refazer sorteio" : "Sortear Times"}</button>
                  <button class="btn danger" type="button" data-action="clear-draw" ${locked ? "" : "disabled"}>Limpar sorteio</button>
                </div>
              </div>
              <div class="card-body">
                ${renderDrawReadiness()}
                ${state.assignments.length ? `
                  <div class="assignment-grid" style="margin-top:16px;">
                    ${state.assignments.map((assignment, index) => renderAssignmentCard(assignment, index, revealLimit)).join("")}
                  </div>
                ` : `
                  <div class="empty-state">
                    <div><span class="empty-icon">${uiIcon("shuffle")}</span><strong>O sorteio aparece aqui.</strong><br>Cadastre 15 a 20 jogadores, marque 4 restritos e defina 2 cabeças por grupo.</div>
                  </div>
                `}
              </div>
            </article>
            <article class="card">
              <div class="card-head">
                <div>
                  <h3 class="card-title">Pool de times</h3>
                  <p class="card-kicker">${available.length}/${TEAMS.length} opções disponíveis</p>
                </div>
              </div>
              <div class="card-body">
                <div class="team-pool">
                  ${TEAMS.map((team) => {
                    const excluded = state.excludedTeams.includes(team.name);
                    return `
                    <div class="team-card ${excluded ? "excluded" : ""}">
                      ${teamMark(team.name)}
                      <div class="team-meta">
                        <strong>${escapeHtml(team.name)}</strong>
                        <span>${escapeHtml(team.kind)} ${restrictedTeamBadge(team.name)} <span class="team-state ${excluded ? "excluded" : ""}">${excluded ? "Excluído" : "Disponível"}</span></span>
                      </div>
                      <button class="btn" type="button" data-action="toggle-team-exclusion" data-team-name="${escapeHtml(team.name)}" ${locked ? "disabled" : ""}>${excluded ? "Ativar" : "Excluir"}</button>
                    </div>
                  `;
                  }).join("")}
                </div>
              </div>
            </article>
          </section>
        `;
      }

      function renderSeedSetup(locked) {
        const required = requiredSeedCount();
        const sizes = groupSizesForCount();
        return `
          <article class="card">
            <div class="card-head">
              <div>
                <h2 class="card-title title-with-icon">${uiIcon("shield")} Cabeças de Chave</h2>
                <p class="card-kicker">${sizes ? `${sizes.length} grupos · 2 cabeças por grupo` : "Disponível com 15 a 20 jogadores"}</p>
              </div>
              <span class="pill ${required && seededCount() === required ? "good" : "warn"}">${seededCount()}/${required || 0} definidos</span>
            </div>
            <div class="card-body">
              ${state.players.length ? `
                <div class="seed-grid">
                  ${state.players.map((player) => `
                    <label class="seed-chip ${locked ? "disabled" : ""}">
                      <strong>${escapeHtml(player.name)}</strong>
                      <input type="checkbox" data-player-seeded="${player.id}" ${player.seeded ? "checked" : ""} ${locked ? "disabled" : ""}>
                    </label>
                  `).join("")}
                </div>
              ` : `
                <div class="empty-state">
                  <div><span class="empty-icon">${uiIcon("users")}</span><strong>Cadastre os jogadores primeiro.</strong><br>Depois marque manualmente os cabeças de chave.</div>
                </div>
              `}
            </div>
          </article>
        `;
      }

      function renderDrawReadiness() {
        const pieces = [];
        const requiredSeeds = requiredSeedCount();
        const availableCount = availableTeams().length;
        if (state.players.length < 15) pieces.push(`faltam ${15 - state.players.length} jogadores`);
        if (state.players.length > 20) pieces.push("há jogadores acima do limite");
        if (restrictedCount() !== 4) pieces.push(`marque ${restrictedCount() < 4 ? `mais ${4 - restrictedCount()}` : `remova ${restrictedCount() - 4}`} restrito(s)`);
        if (!requiredSeeds) pieces.push("defina uma lista entre 15 e 20 jogadores");
        if (requiredSeeds && seededCount() !== requiredSeeds) pieces.push(`marque ${requiredSeeds} cabeça(s) de chave`);
        if (availableCount < state.players.length) pieces.push(`ative mais ${state.players.length - availableCount} time(s) no pool`);
        if (!pieces.length) {
          return `
            <div class="notice good">
              ${uiIcon("check")}
              <div><strong>Tudo pronto para o sorteio.</strong><span class="small-note">Os grupos serão montados com 2 cabeças de chave em cada grupo.</span></div>
            </div>
          `;
        }
        return `
          <div class="notice">
            ${uiIcon("shield")}
            <div><strong>Ajustes antes de sortear</strong><span class="small-note">${pieces.join(" · ")}.</span></div>
          </div>
        `;
      }

      function renderAssignmentCard(assignment, index, revealLimit) {
        const player = playerById(assignment.playerId);
        if (index >= revealLimit) {
          return `<div class="assignment-card hidden-card"><strong>Revelando em instantes...</strong></div>`;
        }
        return `
          <div class="assignment-card revealed">
            ${teamMark(assignment.teamName)}
            <div class="team-meta">
              <strong>${escapeHtml(player ? player.name : "Jogador removido")}</strong>
              <span>${escapeHtml(assignment.teamName)} ${restrictedTeamBadge(assignment.teamName)}</span>
            </div>
          </div>
        `;
      }

      function renderGroups() {
        const done = state.groupMatches.filter((match) => match.saved).length;
        const total = state.groupMatches.length;
        const qualifiedMap = getQualifiedMap();
        return `
          <section class="section" aria-labelledby="groupsTitle">
            <article class="card phase-visual">
              <div class="card-head">
                <div>
                  <h2 id="groupsTitle" class="card-title title-with-icon">${uiIcon("chart")} Fase de Grupos</h2>
                  <p class="card-kicker">Todos contra todos, jogo único dentro de cada grupo.</p>
                </div>
                <div class="toolbar">
                  <span class="pill ${allGroupMatchesComplete() ? "good" : "warn"}">${done}/${total || 0} jogos salvos</span>
                  <button class="btn primary" type="button" data-action="generate-knockout" ${allGroupMatchesComplete() ? "" : "disabled"}>Gerar Mata-mata</button>
                </div>
              </div>
              <div class="card-body">
                ${!state.assignments.length ? `
                  <div class="empty-state">
                    <div><span class="empty-icon">${uiIcon("shuffle")}</span><strong>Faça o sorteio primeiro.</strong><br>Os grupos nascem automaticamente depois dos times.</div>
                  </div>
                ` : ""}
                ${state.assignments.length && !state.groups.length ? `
                  <div class="notice">
                    ${uiIcon("document")}
                    <div><strong>Grupos ainda não gerados.</strong><span class="small-note">Use o botão para montar a tabela com base no número de jogadores.</span></div>
                  </div>
                  <button class="btn primary" type="button" data-action="generate-groups">Gerar grupos</button>
                ` : ""}
                ${state.groups.length ? `
                  <div class="progress-wrap">
                    <div class="progress-bar" aria-hidden="true"><div class="progress-fill" style="--value:${progressValue(done, total)}"></div></div>
                    <span class="small-note">Os 2 primeiros de cada grupo avançam. Para 15 jogadores, os 2 melhores terceiros completam as quartas.</span>
                  </div>
                  ${renderOutOfGroupCard()}
                ` : ""}
              </div>
            </article>
            ${state.groups.length ? `
              <div class="group-grid">
                ${state.groups.map((group) => renderGroupCard(group, qualifiedMap)).join("")}
              </div>
            ` : ""}
          </section>
        `;
      }

      function renderGroupCard(group, qualifiedMap) {
        const standings = computeStandings(group.id);
        const matches = state.groupMatches.filter((match) => match.groupId === group.id);
        return `
          <article class="card group-card">
            <div class="card-head">
              <div>
                <h3 class="card-title">Grupo ${escapeHtml(group.name)}</h3>
                <p class="card-kicker">${group.playerIds.length} jogadores · ${matches.filter((match) => match.saved).length}/${matches.length} jogos</p>
              </div>
            </div>
            <div class="card-body">
              <div class="table-scroll">
                <table>
                  <thead>
                    <tr>
                      <th>Pos</th>
                      <th class="name-cell">Jogador</th>
                      <th>P</th>
                      <th>J</th>
                      <th>V</th>
                      <th>E</th>
                      <th>D</th>
                      <th>GP</th>
                      <th>GC</th>
                      <th>SG</th>
                      <th>Nota</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${standings.map((row, index) => renderStandingRow(row, index, matches, qualifiedMap)).join("")}
                  </tbody>
                </table>
              </div>
              ${renderGroupTools(group)}
              <div class="match-list">
                ${matches.map((match) => renderGroupMatch(match)).join("")}
              </div>
            </div>
          </article>
        `;
      }

      function renderStandingRow(row, index, matches, qualifiedMap) {
        const qualified = qualifiedMap.get(row.playerId);
        const needsOddEven = hasUnresolvedTie(row, matches);
        const cssClass = qualified ? (qualified.kind === "third" ? "third-qualified" : "qualified") : "";
        return `
          <tr class="${cssClass}">
            <td>${index + 1}</td>
            <td class="name-cell">
              <span class="standing-player">${teamMark(row.teamName)} <span>${escapeHtml(row.name)}</span></span>
            </td>
            <td><strong>${row.P}</strong></td>
            <td>${row.J}</td>
            <td>${row.V}</td>
            <td>${row.E}</td>
            <td>${row.D}</td>
            <td>${row.GP}</td>
            <td>${row.GC}</td>
            <td>${row.SG}</td>
            <td>
              ${qualified ? `<span class="badge classified">${qualified.kind === "third" ? "melhor 3º" : "class."}</span>` : ""}
              ${needsOddEven ? `<span class="badge warning">par ou ímpar</span>` : ""}
            </td>
          </tr>
        `;
      }

      function renderGroupTools(group) {
        return `
          <div class="group-tools">
            <div class="group-manage">
              ${group.playerIds.map((playerId) => {
                const details = playerTeamLine(playerId);
                return `
                  <label class="manage-row">
                    <strong>${escapeHtml(details.playerName)}</strong>
                    <select data-player-group="${playerId}" aria-label="Grupo de ${escapeHtml(details.playerName)}">
                      ${renderGroupOptions(group.id)}
                    </select>
                  </label>
                `;
              }).join("")}
            </div>
          </div>
        `;
      }

      function renderOutOfGroupCard() {
        const outsidePlayers = playersOutsideGroups();
        if (!outsidePlayers.length) return "";
        return `
          <div class="group-tools">
            <div class="card-head" style="padding:0;margin-bottom:10px;">
              <div>
                <h3 class="card-title">Fora dos grupos</h3>
                <p class="card-kicker">Jogadores removidos manualmente da tabela.</p>
              </div>
            </div>
            <div class="group-manage">
              ${outsidePlayers.map((player) => `
                <label class="manage-row">
                  <strong>${escapeHtml(player.name)}</strong>
                  <select data-player-group="${player.id}" aria-label="Grupo de ${escapeHtml(player.name)}">
                    ${renderGroupOptions("")}
                  </select>
                </label>
              `).join("")}
            </div>
          </div>
        `;
      }

      function renderGroupOptions(currentGroupId) {
        return `
          <option value="" ${currentGroupId ? "" : "selected"}>Fora</option>
          ${state.groups.map((group) => `<option value="${group.id}" ${group.id === currentGroupId ? "selected" : ""}>Grupo ${escapeHtml(group.name)}</option>`).join("")}
        `;
      }

      function renderGroupMatch(match) {
        const home = playerTeamLine(match.homeId);
        const away = playerTeamLine(match.awayId);
        return `
          <div class="match-card ${match.saved ? "done" : ""}">
            <div class="match-side">
              ${home.mark}
              <div class="match-name">${escapeHtml(home.playerName)}<span class="match-team">${escapeHtml(home.teamName)} ${restrictedTeamBadge(home.teamName)}</span></div>
            </div>
            <div class="score-box" aria-label="Placar">
              <input id="gm-${match.id}-home" class="score-input" type="number" min="0" max="99" inputmode="numeric" value="${match.homeGoals ?? ""}" aria-label="Gols de ${escapeHtml(home.playerName)}" data-score-kind="group" data-match-id="${match.id}" data-score-field="homeGoals">
              <span class="score-dash">×</span>
              <input id="gm-${match.id}-away" class="score-input" type="number" min="0" max="99" inputmode="numeric" value="${match.awayGoals ?? ""}" aria-label="Gols de ${escapeHtml(away.playerName)}" data-score-kind="group" data-match-id="${match.id}" data-score-field="awayGoals">
            </div>
            <div class="match-side right">
              ${away.mark}
              <div class="match-name">${escapeHtml(away.playerName)}<span class="match-team">${escapeHtml(away.teamName)} ${restrictedTeamBadge(away.teamName)}</span></div>
            </div>
            <button class="btn ${match.saved ? "" : "primary"}" type="button" data-action="save-group-match" data-match-id="${match.id}">
              ${match.saved ? "Atualizar" : "Salvar"}
            </button>
          </div>
        `;
      }

      function renderKnockout() {
        const qualifiers = getQualifiedList();
        return `
          <section class="section" aria-labelledby="knockoutTitle">
            ${state.knockout && state.knockout.championId ? renderChampion(state.knockout.championId) : ""}
            <article class="card knockout-panel">
              <div class="card-head">
                <div>
                  <h2 id="knockoutTitle" class="card-title title-with-icon">${uiIcon("trophy")} Mata-mata</h2>
                  <p class="card-kicker">Quartas em ida e volta; semifinal e final em jogo único.</p>
                </div>
                <div class="toolbar">
                  <button class="btn primary" type="button" data-action="generate-knockout" ${allGroupMatchesComplete() ? "" : "disabled"}>${state.knockout ? "Refazer chaveamento" : "Gerar Mata-mata"}</button>
                </div>
              </div>
              <div class="card-body">
                ${!state.groups.length ? `
                  <div class="empty-state">
                    <div><span class="empty-icon">${uiIcon("chart")}</span><strong>A fase de grupos ainda não existe.</strong><br>Faça o sorteio para montar grupos e partidas.</div>
                  </div>
                ` : ""}
                ${state.groups.length && !allGroupMatchesComplete() ? `
                  <div class="notice">
                    ${uiIcon("clock")}
                    <div><strong>Finalize os grupos para gerar a chave.</strong><span class="small-note">Ainda faltam ${state.groupMatches.filter((match) => !match.saved).length} partida(s) salvas.</span></div>
                  </div>
                ` : ""}
                ${state.groups.length && !state.knockout ? renderQualifierPreview(qualifiers) : ""}
                ${state.knockout ? renderBracket() : ""}
              </div>
            </article>
          </section>
        `;
      }

      function renderQualifierPreview(qualifiers) {
        if (!qualifiers.length) return "";
        return `
          <div class="notice good">
            ${uiIcon("check")}
            <div><strong>${qualifiers.length} classificados previstos</strong><span class="small-note">A chave cruza líderes contra vices de outros grupos sempre que possível.</span></div>
          </div>
          <div class="qualifier-grid" style="margin-top:14px;">
            ${qualifiers.map((entry) => renderQualifierCard(entry)).join("")}
          </div>
        `;
      }

      function renderQualifierCard(entry) {
        const details = playerTeamLine(entry.playerId);
        return `
          <div class="qualifier-card">
            ${details.mark}
            <div class="team-meta">
              <strong>${escapeHtml(details.playerName)}</strong>
              <span>Grupo ${escapeHtml(entry.groupName)} · ${entry.rank}º lugar${entry.kind === "third" ? " · melhor 3º" : ""}</span>
            </div>
          </div>
        `;
      }

      function renderBracket() {
        const firstRoundMatches = state.knockout.rounds[0]?.matches.length || 1;
        const bracketHeight = Math.max(520, firstRoundMatches * 178);
        return `
          <div class="bracket" style="--bracket-height:${bracketHeight}px" aria-label="Chaveamento do mata-mata">
            ${state.knockout.rounds.map((round, roundIndex) => `
              <section class="round">
                <h3 class="round-title">${escapeHtml(round.name)}</h3>
                <div class="round-matches">
                  ${round.matches.map((match, matchIndex) => renderKnockoutMatch(match, roundIndex, matchIndex)).join("")}
                </div>
              </section>
            `).join("")}
          </div>
        `;
      }

      function renderKnockoutMatch(match, roundIndex, matchIndex) {
        const ready = Boolean(match.homeId && match.awayId);
        const twoLegged = isTwoLeggedKnockout(match, roundIndex);
        const aggregate = aggregateForMatch(match, roundIndex);
        const needsPenalties = aggregate.complete && aggregate.home === aggregate.away;
        const winnerName = match.winnerId ? escapeHtml(playerById(match.winnerId)?.name || "A definir") : "Aguardando vencedor";
        return `
          <div class="ko-match ${match.saved ? "done" : ""}">
            <div class="ko-match-header">
              <span class="badge">${escapeHtml(match.label || `Jogo ${matchIndex + 1}`)}</span>
              <span class="ko-format">${twoLegged ? "Ida e volta" : "Jogo único"}</span>
            </div>
            <div class="ko-teams-row">
              ${renderKnockoutTeam(match, "home")}
              <div class="aggregate-score">
                <strong>${aggregate.complete ? `${aggregate.home} × ${aggregate.away}` : "×"}</strong>
                <span>${twoLegged ? "Agregado" : "Placar"}</span>
              </div>
              ${renderKnockoutTeam(match, "away")}
            </div>
            <div class="leg-board ${twoLegged ? "" : "single"}">
              ${knockoutLegsForMatch(match, roundIndex).map((leg, legIndex) => renderKnockoutLegRow(match, leg, legIndex, roundIndex, matchIndex, ready)).join("")}
            </div>
            <div class="penalty-row ${needsPenalties ? "active" : ""}">
              <span class="leg-label">Pênaltis</span>
              <input id="ko-${match.id}-home-pen" class="penalty-input" type="number" min="0" max="99" inputmode="numeric" value="${match.homePenalties ?? ""}" aria-label="Pênaltis de ${escapeHtml(playerTeamLine(match.homeId).playerName)}" data-score-kind="knockout" data-round="${roundIndex}" data-match-index="${matchIndex}" data-score-field="homePenalties" ${ready && needsPenalties ? "" : "disabled"}>
              <span class="score-dash">×</span>
              <input id="ko-${match.id}-away-pen" class="penalty-input" type="number" min="0" max="99" inputmode="numeric" value="${match.awayPenalties ?? ""}" aria-label="Pênaltis de ${escapeHtml(playerTeamLine(match.awayId).playerName)}" data-score-kind="knockout" data-round="${roundIndex}" data-match-index="${matchIndex}" data-score-field="awayPenalties" ${ready && needsPenalties ? "" : "disabled"}>
              <span class="penalty-hint">${needsPenalties ? "desempate do agregado" : "só se empatar"}</span>
            </div>
            <div class="winner-row">
              <span>${match.winnerId ? `Vencedor: ${winnerName}` : "Aguardando vencedor"}</span>
              <button class="btn ${match.saved ? "" : "primary"}" type="button" data-action="save-ko-match" data-round="${roundIndex}" data-match-index="${matchIndex}" ${ready ? "" : "disabled"}>
                ${match.saved ? "Atualizar" : "Salvar"}
              </button>
            </div>
          </div>
        `;
      }

      function renderKnockoutTeam(match, side) {
        const playerId = match[`${side}Id`];
        const details = playerId ? playerTeamLine(playerId) : {
          playerName: "Aguardando",
          teamName: "Vencedor anterior",
          mark: `<span class="team-mark logo placeholder" aria-hidden="true">${uiIcon("shield")}</span>`
        };
        const seed = match[`${side}Seed`] || "vem da fase anterior";
        return `
          <div class="ko-team ${side === "away" ? "right" : ""}">
            ${details.mark}
            <div class="ko-team-name">
              <strong>${escapeHtml(details.playerName)}</strong>
              <span>${escapeHtml(seed)} · ${escapeHtml(details.teamName)} ${restrictedTeamBadge(details.teamName)}</span>
            </div>
          </div>
        `;
      }

      function renderKnockoutLegRow(match, leg, legIndex, roundIndex, matchIndex, ready) {
        return `
          <div class="leg-row">
            <span class="leg-label">${escapeHtml(leg.label)}</span>
            <input id="ko-${match.id}-leg-${legIndex}-home" class="score-input" type="number" min="0" max="99" inputmode="numeric" value="${leg.homeGoals ?? ""}" aria-label="${escapeHtml(leg.label)}: gols do mandante" data-score-kind="knockout-leg" data-round="${roundIndex}" data-match-index="${matchIndex}" data-leg-index="${legIndex}" data-score-field="homeGoals" ${ready ? "" : "disabled"}>
            <span class="score-dash">×</span>
            <input id="ko-${match.id}-leg-${legIndex}-away" class="score-input" type="number" min="0" max="99" inputmode="numeric" value="${leg.awayGoals ?? ""}" aria-label="${escapeHtml(leg.label)}: gols do visitante" data-score-kind="knockout-leg" data-round="${roundIndex}" data-match-index="${matchIndex}" data-leg-index="${legIndex}" data-score-field="awayGoals" ${ready ? "" : "disabled"}>
          </div>
        `;
      }

      function isTwoLeggedKnockout(match, roundIndex) {
        return state.knockout?.rounds?.[roundIndex]?.name === "Quartas" || Boolean(match.twoLegged);
      }

      function blankKnockoutLegs(twoLegged) {
        return twoLegged
          ? [
              { label: "Ida", homeGoals: null, awayGoals: null },
              { label: "Volta", homeGoals: null, awayGoals: null }
            ]
          : undefined;
      }

      function knockoutLegsForMatch(match, roundIndex) {
        const twoLegged = isTwoLeggedKnockout(match, roundIndex);
        if (!twoLegged) {
          return [{ label: "Jogo", homeGoals: match.homeGoals ?? null, awayGoals: match.awayGoals ?? null }];
        }
        const legs = Array.isArray(match.legs) ? match.legs : [];
        return ["Ida", "Volta"].map((label, index) => ({
          label,
          homeGoals: legs[index]?.homeGoals ?? null,
          awayGoals: legs[index]?.awayGoals ?? null
        }));
      }

      function aggregateForMatch(match, roundIndex) {
        const legs = knockoutLegsForMatch(match, roundIndex);
        const complete = legs.every((leg) => leg.homeGoals !== null
          && leg.homeGoals !== undefined
          && leg.awayGoals !== null
          && leg.awayGoals !== undefined);
        return {
          home: legs.reduce((sum, leg) => sum + (Number(leg.homeGoals) || 0), 0),
          away: legs.reduce((sum, leg) => sum + (Number(leg.awayGoals) || 0), 0),
          complete
        };
      }

      function renderKnockoutPlayer(match, side, roundIndex, matchIndex) {
        const playerId = match[`${side}Id`];
        const details = playerId ? playerTeamLine(playerId) : {
          playerName: "Aguardando",
          teamName: "Vencedor anterior",
          mark: `<span class="team-mark logo placeholder" aria-hidden="true">${uiIcon("shield")}</span>`
        };
        const goals = match[`${side}Goals`] ?? "";
        const penalties = match[`${side}Penalties`] ?? "";
        const seed = match[`${side}Seed`] || (roundIndex === 0 ? "" : "vem da fase anterior");
        return `
          <div class="ko-player">
            ${details.mark}
            <div class="ko-name">
              ${escapeHtml(details.playerName)}
              <div class="ko-seed">${escapeHtml(seed)} · ${escapeHtml(details.teamName)} ${restrictedTeamBadge(details.teamName)}</div>
            </div>
            <input id="ko-${match.id}-${side}-goals" class="score-input" type="number" min="0" max="99" inputmode="numeric" value="${goals}" aria-label="Gols de ${escapeHtml(details.playerName)}" data-score-kind="knockout" data-round="${roundIndex}" data-match-index="${matchIndex}" data-score-field="${side}Goals" ${playerId ? "" : "disabled"}>
            <input id="ko-${match.id}-${side}-pen" class="penalty-input" type="number" min="0" max="99" inputmode="numeric" value="${penalties}" title="Pênaltis" aria-label="Pênaltis de ${escapeHtml(details.playerName)}" data-score-kind="knockout" data-round="${roundIndex}" data-match-index="${matchIndex}" data-score-field="${side}Penalties" ${playerId ? "" : "disabled"}>
          </div>
        `;
      }

      function renderChampion(playerId) {
        const details = playerTeamLine(playerId);
        const confetti = Array.from({ length: 36 }, (_, index) => {
          const colors = ["#b8ff38", "#f5f7f4", "#707570", "#b8ff38", "#ffffff"];
          return `<span style="--x:${(index * 29) % 100}%;--c:${colors[index % colors.length]};--d:${2.8 + (index % 8) * .22}s;--delay:${-(index % 12) * .22}s;--r:${(index * 37) % 180}deg"></span>`;
        }).join("");
        return `
          <section class="champion" aria-label="Campeão do FUTFRALDA">
            <div class="confetti" aria-hidden="true">${confetti}</div>
            <div class="champion-cup" aria-hidden="true">${uiIcon("trophy")}</div>
            <div>
              <h2>CAMPEÃO DO FUTFRALDA</h2>
              <p>${escapeHtml(details.playerName)} levantou a taça com ${escapeHtml(details.teamName)}.</p>
            </div>
          </section>
        `;
      }

      function rankingKey(name) {
        return String(name || "")
          .trim()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLocaleLowerCase("pt-BR");
      }

      function emptyRankingRow(name) {
        return {
          name,
          P: 0,
          J: 0,
          V: 0,
          E: 0,
          D: 0,
          GP: 0,
          GC: 0,
          SG: 0
        };
      }

      function ensureRankingRow(map, name) {
        const cleanName = String(name || "Jogador removido").trim() || "Jogador removido";
        const key = rankingKey(cleanName);
        if (!map.has(key)) map.set(key, emptyRankingRow(cleanName));
        return map.get(key);
      }

      function addRankingTotals(map, sourceRow) {
        const row = ensureRankingRow(map, sourceRow.name);
        ["P", "J", "V", "E", "D", "GP", "GC"].forEach((field) => {
          row[field] += Number(sourceRow[field]) || 0;
        });
        row.SG = row.GP - row.GC;
      }

      function addRankingMatch(map, homeId, awayId, homeGoals, awayGoals) {
        if (homeGoals === null || awayGoals === null || homeGoals === undefined || awayGoals === undefined) return;
        const home = playerById(homeId);
        const away = playerById(awayId);
        if (!home || !away) return;
        const homeRow = ensureRankingRow(map, home.name);
        const awayRow = ensureRankingRow(map, away.name);

        homeRow.J += 1;
        awayRow.J += 1;
        homeRow.GP += homeGoals;
        homeRow.GC += awayGoals;
        awayRow.GP += awayGoals;
        awayRow.GC += homeGoals;

        if (homeGoals > awayGoals) {
          homeRow.V += 1;
          homeRow.P += 3;
          awayRow.D += 1;
        } else if (homeGoals < awayGoals) {
          awayRow.V += 1;
          awayRow.P += 3;
          homeRow.D += 1;
        } else {
          homeRow.E += 1;
          awayRow.E += 1;
          homeRow.P += 1;
          awayRow.P += 1;
        }

        homeRow.SG = homeRow.GP - homeRow.GC;
        awayRow.SG = awayRow.GP - awayRow.GC;
      }

      function rankingLegsForMatch(match, roundName) {
        const twoLegged = roundName === "Quartas" || match.twoLegged;
        if (twoLegged && Array.isArray(match.legs)) {
          return match.legs.filter((leg) => leg.homeGoals !== null
            && leg.homeGoals !== undefined
            && leg.awayGoals !== null
            && leg.awayGoals !== undefined);
        }
        return [{
          homeGoals: match.homeGoals,
          awayGoals: match.awayGoals
        }];
      }

      function rankingRowByName(rows, name) {
        const key = rankingKey(name);
        return rows.find((row) => rankingKey(row.name) === key) || null;
      }

      function rankingAdjustmentFor(name) {
        const key = rankingKey(name);
        return state.rankingAdjustments.find((row) => rankingKey(row.name) === key) || null;
      }

      function computeRanking({ includeManual = true } = {}) {
        const rows = new Map();
        RANKING_BASE.forEach((row) => addRankingTotals(rows, row));
        state.players.forEach((player) => ensureRankingRow(rows, player.name));

        state.groupMatches
          .filter((match) => match.saved && !match.rankingBaseMatch)
          .forEach((match) => addRankingMatch(rows, match.homeId, match.awayId, match.homeGoals, match.awayGoals));

        state.knockout?.rounds?.forEach((round) => {
          round.matches
            .filter((match) => match.saved && !match.rankingBaseMatch)
            .forEach((match) => {
              rankingLegsForMatch(match, round.name).forEach((leg) => {
                addRankingMatch(rows, match.homeId, match.awayId, leg.homeGoals, leg.awayGoals);
              });
            });
        });

        if (includeManual) {
          state.rankingAdjustments.forEach((row) => addRankingTotals(rows, row));
        }

        return Array.from(rows.values())
          .map((row) => ({ ...row, SG: row.GP - row.GC }))
          .sort(compareRankingRows);
      }

      function compareRankingRows(a, b) {
        if (b.P !== a.P) return b.P - a.P;
        if (b.SG !== a.SG) return b.SG - a.SG;
        if (b.GP !== a.GP) return b.GP - a.GP;
        if (b.V !== a.V) return b.V - a.V;
        if (a.GC !== b.GC) return a.GC - b.GC;
        return a.name.localeCompare(b.name, "pt-BR");
      }

      function renderRanking() {
        const ranking = computeRanking();
        const totalGames = Math.round(ranking.reduce((sum, row) => sum + row.J, 0) / 2);
        const totalGoals = ranking.reduce((sum, row) => sum + row.GP, 0);
        const leader = ranking[0];
        const manualCount = state.rankingAdjustments.length;
        const sourceNote = manualCount
          ? `Base histórica corrigida + placares novos + ${manualCount} ajuste(s) manual(is).`
