          : "Base histórica corrigida + placares novos salvos nesta edição.";
        return `
          <section class="section" aria-labelledby="rankingTitle">
            <article class="card">
              <div class="card-head">
                <div>
                  <h2 id="rankingTitle" class="card-title title-with-icon">${uiIcon("chart")} Ranking Geral</h2>
                  <p class="card-kicker">${sourceNote}</p>
                </div>
                <span class="pill good">3V · 1E · 0D</span>
              </div>
              <div class="card-body">
                <div class="ranking-summary">
                  <div class="ranking-metric"><strong>${leader ? escapeHtml(leader.name) : "—"}</strong><span>Líder</span></div>
                  <div class="ranking-metric"><strong>${totalGames}</strong><span>Jogos computados</span></div>
                  <div class="ranking-metric"><strong>${totalGoals}</strong><span>Gols marcados</span></div>
                  <div class="ranking-metric"><strong>SG</strong><span>GP menos GC</span></div>
                </div>
                <div class="notice good ranking-rules">
                  ${uiIcon("check")}
                  <div><strong>Modelo de pontuação</strong><span class="small-note">Vitória vale 3, empate vale 1, derrota vale 0. Nas quartas, ida e volta contam como dois jogos no ranking; a vaga sai pelo agregado.</span></div>
                </div>
                ${renderRankingEditor(ranking)}
                <div class="table-scroll">
                  <table>
                    <thead>
                      <tr>
                        <th>Pos</th>
                        <th class="name-cell">Jogador</th>
                        <th>P</th>
                        <th>J</th>
                        <th>V</th>
                        <th>E</th>
                        <th>D</th>
                        <th>GP</th>
                        <th>GC</th>
                        <th>SG</th>
                      </tr>
                    </thead>
                    <tbody>
                      ${ranking.map((row, index) => renderRankingRow(row, index)).join("")}
                    </tbody>
                  </table>
                </div>
              </div>
            </article>
          </section>
        `;
      }

      function selectedRankingEditorName(ranking) {
        const savedName = state.rankingEditorName;
        if (savedName && rankingRowByName(ranking, savedName)) return savedName;
        return ranking[0]?.name || "";
      }

      function renderRankingEditor(ranking) {
        if (!ranking.length) return "";
        const selectedName = selectedRankingEditorName(ranking);
        const currentRow = rankingRowByName(ranking, selectedName) || emptyRankingRow(selectedName);
        const autoRow = rankingRowByName(computeRanking({ includeManual: false }), selectedName) || emptyRankingRow(selectedName);
        const hasAdjustment = Boolean(rankingAdjustmentFor(selectedName));
        const fieldLabels = {
          P: "Pontos",
          J: "Jogos",
          V: "Vitórias",
          E: "Empates",
          D: "Derrotas",
          GP: "Gols pró",
          GC: "Gols contra"
        };
        return `
          <div class="ranking-editor">
            <div class="ranking-editor-head">
              <div>
                <h3 class="card-title">Ajuste manual</h3>
                <p class="card-kicker">Totais editáveis por jogador.</p>
              </div>
              <select data-ranking-editor-player aria-label="Jogador para ajustar no ranking">
                ${ranking.map((row) => `<option value="${escapeHtml(row.name)}" ${rankingKey(row.name) === rankingKey(selectedName) ? "selected" : ""}>${escapeHtml(row.name)}</option>`).join("")}
              </select>
            </div>
            <div class="ranking-edit-grid">
              ${RANKING_FIELDS.map((field) => `
                <label class="ranking-field">
                  <span>${field}</span>
                  <input class="ranking-input" type="number" min="0" max="999" inputmode="numeric" value="${currentRow[field] ?? 0}" aria-label="${fieldLabels[field]}" data-ranking-field="${field}">
                  <small>Auto ${autoRow[field] ?? 0}</small>
                </label>
              `).join("")}
            </div>
            <div class="ranking-editor-actions">
              <span class="small-note">${hasAdjustment ? "Ajuste ativo para este jogador." : "Sem ajuste manual para este jogador."}</span>
              <div class="toolbar">
                <button class="btn primary" type="button" data-action="save-ranking-adjustment">Salvar ajuste</button>
                <button class="btn" type="button" data-action="reset-ranking-adjustment" ${hasAdjustment ? "" : "disabled"}>Limpar jogador</button>
                <button class="btn danger" type="button" data-action="reset-ranking-adjustments" ${state.rankingAdjustments.length ? "" : "disabled"}>Limpar ajustes</button>
              </div>
            </div>
          </div>
        `;
      }

      function renderRankingRow(row, index) {
        const adjusted = Boolean(rankingAdjustmentFor(row.name));
        return `
          <tr>
            <td>${index + 1}</td>
            <td class="name-cell"><strong>${escapeHtml(row.name)}</strong>${adjusted ? `<span class="badge ranking-manual-badge">manual</span>` : ""}</td>
            <td><strong>${row.P}</strong></td>
            <td>${row.J}</td>
            <td>${row.V}</td>
            <td>${row.E}</td>
            <td>${row.D}</td>
            <td>${row.GP}</td>
            <td>${row.GC}</td>
            <td>${row.SG}</td>
          </tr>
        `;
      }

      function parseRankingValue(value) {
        if (value === "" || value === null || value === undefined) return null;
        const number = Number(value);
        if (!Number.isInteger(number) || number < 0 || number > 999) return null;
        return number;
      }

      function selectRankingEditorPlayer(name) {
        state.rankingEditorName = name;
        saveState();
        render();
      }

      function saveRankingAdjustment() {
        const ranking = computeRanking();
        const selectedName = selectedRankingEditorName(ranking);
        if (!selectedName) return;
        const autoRow = rankingRowByName(computeRanking({ includeManual: false }), selectedName) || emptyRankingRow(selectedName);
        const nextAdjustment = { name: selectedName };
        let hasAdjustment = false;

        for (const field of RANKING_FIELDS) {
          const input = document.querySelector(`[data-ranking-field="${field}"]`);
          const value = parseRankingValue(input?.value);
          if (value === null) {
            notify("Preencha todos os campos do ranking com números válidos.");
            return;
          }
          const delta = value - (Number(autoRow[field]) || 0);
          nextAdjustment[field] = delta;
          if (delta !== 0) hasAdjustment = true;
        }

        const selectedKey = rankingKey(selectedName);
        state.rankingAdjustments = state.rankingAdjustments.filter((row) => rankingKey(row.name) !== selectedKey);
        if (hasAdjustment) state.rankingAdjustments.push(nextAdjustment);
        state.rankingEditorName = selectedName;
        saveState();
        render();
        notify(hasAdjustment ? "Ranking atualizado manualmente." : "Ajuste manual removido.");
      }

      function resetRankingAdjustment() {
        const selectedName = selectedRankingEditorName(computeRanking());
        const selectedKey = rankingKey(selectedName);
        const before = state.rankingAdjustments.length;
        state.rankingAdjustments = state.rankingAdjustments.filter((row) => rankingKey(row.name) !== selectedKey);
        saveState();
        render();
        notify(before === state.rankingAdjustments.length ? "Esse jogador não tinha ajuste manual." : "Ajuste do jogador removido.");
      }

      function resetRankingAdjustments() {
        if (!state.rankingAdjustments.length) return;
        if (!confirm("Limpar todos os ajustes manuais do ranking?")) return;
        state.rankingAdjustments = [];
        saveState();
        render();
        notify("Ajustes manuais removidos.");
      }

      function renderRules() {
        return `
          <section class="section" aria-labelledby="rulesTitle">
            <article class="card">
              <div class="card-head">
                <div>
                  <h2 id="rulesTitle" class="card-title title-with-icon">${uiIcon("document")} Painel de Regras</h2>
                  <p class="card-kicker">Cole, edite e consulte as regras durante o evento.</p>
                </div>
              </div>
              <div class="card-body rules-layout">
                <div>
                  <textarea class="textarea" data-rules-text placeholder="Cole as regras aqui. Use linhas iniciadas com - para listas e # para títulos.">${escapeHtml(state.rulesText)}</textarea>
                </div>
                <div class="card" style="box-shadow:none;">
                  <div class="card-head">
                    <div>
                      <h3 class="card-title">Consulta rápida</h3>
                      <p class="card-kicker">Prévia salva automaticamente</p>
                    </div>
                  </div>
                  <div id="rulesPreview" class="card-body rules-preview">${formatRules(state.rulesText)}</div>
                </div>
              </div>
            </article>
          </section>
        `;
      }

      function addPlayer(name) {
        const clean = name.trim().replace(/\s+/g, " ");
        if (!clean) {
          notify("Digite um nome para adicionar.");
          return;
        }
        if (hasDraw()) {
          notify("O cadastro está travado depois do sorteio.");
          return;
        }
        if (state.players.length >= 20) {
          notify("O limite é de 20 jogadores.");
          return;
        }
        if (state.players.some((player) => player.name.localeCompare(clean, "pt-BR", { sensitivity: "accent" }) === 0)) {
          notify("Esse nome já está na lista.");
          return;
        }
        state.players.push({ id: uid("player"), name: clean, restricted: false, seeded: false });
        saveState();
        render();
      }

      function updatePlayerName(playerId, name) {
        if (hasDraw()) return;
        const player = playerById(playerId);
        const clean = name.trim().replace(/\s+/g, " ");
        if (!player || !clean) {
          notify("O nome não pode ficar vazio.");
          render();
          return;
        }
        const duplicated = state.players.some((item) => item.id !== playerId && item.name.localeCompare(clean, "pt-BR", { sensitivity: "accent" }) === 0);
        if (duplicated) {
          notify("Já existe outro jogador com esse nome.");
          render();
          return;
        }
        player.name = clean;
        saveState();
        render();
      }

      function updateRestricted(playerId, checked) {
        if (hasDraw()) return;
        const player = playerById(playerId);
        if (!player) return;
        if (checked && !player.restricted && restrictedCount() >= 4) {
          notify("Já existem 4 jogadores restritos.");
          render();
          return;
        }
        player.restricted = checked;
        saveState();
        render();
      }

      function updateSeeded(playerId, checked) {
        if (hasDraw()) return;
        const player = playerById(playerId);
        if (!player) return;
        const required = requiredSeedCount();
        if (checked && !player.seeded && (!required || seededCount() >= required)) {
          notify(required ? `Marque no máximo ${required} cabeças de chave.` : "Cadastre 15 a 20 jogadores antes de definir cabeças.");
          render();
          return;
        }
        player.seeded = checked;
        saveState();
        render();
      }

      function removePlayer(playerId) {
        if (hasDraw()) return;
        state.players = state.players.filter((player) => player.id !== playerId);
        saveState();
        render();
      }

      function toggleTeamExclusion(teamName) {
        if (hasDraw()) {
          notify("Altere o pool antes do sorteio.");
          return;
        }
        if (!TEAM_BY_NAME.has(teamName)) return;
        const excluded = new Set(state.excludedTeams);
        if (excluded.has(teamName)) {
          excluded.delete(teamName);
        } else {
          excluded.add(teamName);
        }
        state.excludedTeams = Array.from(excluded);
        saveState();
        render();
      }

      function clearDraw() {
        if (!hasDraw()) return;
        if (!confirm("Apagar sorteio, grupos, resultados e mata-mata?")) return;
        state.assignments = [];
        state.groups = [];
        state.groupMatches = [];
        state.knockout = null;
        revealCount = Infinity;
        clearInterval(revealTimer);
        saveState();
        render();
        notify("Sorteio e resultados apagados.");
      }

      function drawTeams() {
        if (!canDraw()) {
          notify("Para sortear: 15 a 20 jogadores, 4 restritos, cabeças definidos e times suficientes.");
          return;
        }
        if (hasDraw() && !confirm("Refazer o sorteio apaga grupos, placares e mata-mata. Continuar?")) {
          return;
        }

        // Sorteio: embaralha o pool ativo e aceita somente permutações que respeitam a restrição.
        const pool = availableTeams();
        let assignments = null;
        for (let attempt = 0; attempt < 5000; attempt += 1) {
          const teams = shuffle(pool).slice(0, state.players.length);
          const candidate = state.players.map((player, index) => ({
            playerId: player.id,
            teamName: teams[index].name
          }));
          const valid = candidate.every((assignment) => {
            const player = playerById(assignment.playerId);
            return !player?.restricted || !FORBIDDEN_FOR_RESTRICTED.has(assignment.teamName);
          });
          if (valid) {
            assignments = candidate;
            break;
          }
        }

        if (!assignments) {
          notify("Não foi possível montar um sorteio válido. Tente novamente.");
          return;
        }

        state.assignments = assignments;
        if (!generateGroupsAndMatches()) {
          state.assignments = [];
          return;
        }
        state.knockout = null;
        state.activeTab = "draw";
        saveState();
        startReveal(assignments.length);
        notify("Sorteio feito. Grupos e jogos foram montados.");
      }

      function startReveal(total) {
        clearInterval(revealTimer);
        revealCount = 0;
        render();
        revealTimer = setInterval(() => {
          revealCount += 1;
          render();
          if (revealCount >= total) {
            clearInterval(revealTimer);
            revealCount = Infinity;
          }
        }, 400);
      }

      function generateGroupsAndMatches() {
        const sizes = groupSizesForCount();
        if (!sizes) {
          notify("Os grupos só podem ser gerados com 15 a 20 jogadores.");
          return false;
        }
        const required = sizes.length * 2;
        const seededPlayers = shuffle(state.players.filter((player) => player.seeded).map((player) => player.id));
        if (seededPlayers.length !== required) {
          notify(`Defina ${required} cabeças de chave antes de montar os grupos.`);
          return false;
        }

        state.groups = sizes.map((size, index) => ({
          id: uid("group"),
          name: String.fromCharCode(65 + index),
          playerIds: [],
          size
        }));

        seededPlayers.forEach((playerId, index) => {
          state.groups[index % state.groups.length].playerIds.push(playerId);
        });

        const remainingPlayers = shuffle(state.players.filter((player) => !player.seeded).map((player) => player.id));
        state.groups.forEach((group) => {
          while (group.playerIds.length < group.size && remainingPlayers.length) {
            group.playerIds.push(remainingPlayers.shift());
          }
        });

        rebuildGroupMatches({ preserve: false });
        state.knockout = null;
        return true;
      }

      function groupMatchKey(groupId, homeId, awayId) {
        return [groupId, ...[homeId, awayId].sort()].join(":");
      }

      function rebuildGroupMatches({ preserve = true } = {}) {
        const previous = new Map();
        if (preserve) {
          state.groupMatches.forEach((match) => {
            previous.set(groupMatchKey(match.groupId, match.homeId, match.awayId), match);
          });
        }

        const activePlayers = new Set(state.players.map((player) => player.id));
        const nextMatches = [];
        state.groups.forEach((group) => {
          group.playerIds = Array.from(new Set(group.playerIds)).filter((playerId) => activePlayers.has(playerId));
          for (let homeIndex = 0; homeIndex < group.playerIds.length; homeIndex += 1) {
            for (let awayIndex = homeIndex + 1; awayIndex < group.playerIds.length; awayIndex += 1) {
              const homeId = group.playerIds[homeIndex];
              const awayId = group.playerIds[awayIndex];
              const oldMatch = previous.get(groupMatchKey(group.id, homeId, awayId));
              if (oldMatch) {
                const sameOrder = oldMatch.homeId === homeId && oldMatch.awayId === awayId;
                nextMatches.push({
                  ...oldMatch,
                  groupId: group.id,
                  homeId,
                  awayId,
                  homeGoals: sameOrder ? oldMatch.homeGoals : oldMatch.awayGoals,
                  awayGoals: sameOrder ? oldMatch.awayGoals : oldMatch.homeGoals
                });
              } else {
                nextMatches.push({
                  id: uid("gm"),
                  groupId: group.id,
                  homeId,
                  awayId,
                  homeGoals: null,
                  awayGoals: null,
                  saved: false
                });
              }
            }
          }
        });
        state.groupMatches = nextMatches;
        state.knockout = null;
      }

      function playersOutsideGroups() {
        const grouped = new Set(state.groups.flatMap((group) => group.playerIds));
        const assigned = new Set(state.assignments.map((assignment) => assignment.playerId));
        return state.players.filter((player) => assigned.has(player.id) && !grouped.has(player.id));
      }

      function movePlayerToGroup(playerId, targetGroupId) {
        if (!state.groups.length || !playerById(playerId)) return;
        const targetGroup = targetGroupId ? state.groups.find((group) => group.id === targetGroupId) : null;
        if (targetGroupId && !targetGroup) return;

        state.groups.forEach((group) => {
          group.playerIds = group.playerIds.filter((id) => id !== playerId);
        });
        if (targetGroup) {
          targetGroup.playerIds.push(playerId);
        }
        rebuildGroupMatches({ preserve: true });
        saveState();
        render();
        notify(targetGroup ? "Jogador movido de grupo." : "Jogador removido dos grupos.");
      }

      function saveGroupMatch(matchId) {
        const match = state.groupMatches.find((item) => item.id === matchId);
        if (!match) return;
        const homeInput = document.getElementById(`gm-${match.id}-home`);
        const awayInput = document.getElementById(`gm-${match.id}-away`);
        const homeGoals = parseScore(homeInput?.value);
        const awayGoals = parseScore(awayInput?.value);
        if (homeGoals === null || awayGoals === null) {
          notify("Informe placares válidos para os dois lados.");
          return;
        }
        match.homeGoals = homeGoals;
        match.awayGoals = awayGoals;
        match.saved = true;
        if (state.knockout) {
          state.knockout = null;
          notify("Resultado salvo. O mata-mata foi limpo para refletir a nova classificação.");
        } else {
          notify("Resultado salvo.");
        }
        saveState();
        render();
      }

      function updateScoreDraft(input) {
        const rawValue = String(input.value ?? "").trim();
        const parsedValue = rawValue === "" ? null : parseScore(rawValue);
        if (rawValue !== "" && parsedValue === null) return;

        if (input.dataset.scoreKind === "group") {
          const field = input.dataset.scoreField;
          if (!["homeGoals", "awayGoals"].includes(field)) return;
          const match = state.groupMatches.find((item) => item.id === input.dataset.matchId);
          if (!match) return;
          match[field] = parsedValue;
          if (match.saved) {
            match.saved = false;
            state.knockout = null;
          }
          saveState();
          return;
        }

        if (input.dataset.scoreKind === "knockout-leg") {
          const field = input.dataset.scoreField;
          if (!["homeGoals", "awayGoals"].includes(field)) return;
          const roundIndex = Number(input.dataset.round);
          const matchIndex = Number(input.dataset.matchIndex);
          const legIndex = Number(input.dataset.legIndex);
          if (!Number.isInteger(roundIndex) || !Number.isInteger(matchIndex) || !Number.isInteger(legIndex)) return;
          const match = state.knockout?.rounds?.[roundIndex]?.matches?.[matchIndex];
          if (!match) return;
          if (isTwoLeggedKnockout(match, roundIndex)) {
            match.legs = knockoutLegsForMatch(match, roundIndex);
            if (!match.legs[legIndex]) return;
            match.legs[legIndex][field] = parsedValue;
            const aggregate = aggregateForMatch(match, roundIndex);
            match.homeGoals = aggregate.complete ? aggregate.home : null;
            match.awayGoals = aggregate.complete ? aggregate.away : null;
          } else {
            match[field] = parsedValue;
          }
          if (match.saved) {
            match.saved = false;
            match.winnerId = null;
            propagateKnockout();
          }
          saveState();
          return;
        }

        if (input.dataset.scoreKind === "knockout") {
          const field = input.dataset.scoreField;
          if (!["homeGoals", "awayGoals", "homePenalties", "awayPenalties"].includes(field)) return;
          const roundIndex = Number(input.dataset.round);
          const matchIndex = Number(input.dataset.matchIndex);
          if (!Number.isInteger(roundIndex) || !Number.isInteger(matchIndex)) return;
          const match = state.knockout?.rounds?.[roundIndex]?.matches?.[matchIndex];
          if (!match) return;
          match[field] = parsedValue;
          if (match.saved) {
            match.saved = false;
            match.winnerId = null;
            propagateKnockout();
          }
          saveState();
        }
      }

      function parseScore(value) {
        if (value === "" || value === null || value === undefined) return null;
        const number = Number(value);
        if (!Number.isInteger(number) || number < 0 || number > 99) return null;
        return number;
      }

      function computeStandings(groupId) {
        const group = state.groups.find((item) => item.id === groupId);
        if (!group) return [];
        const rows = new Map();
        group.playerIds.forEach((playerId) => {
          const player = playerById(playerId);
          const team = teamForPlayer(playerId);
          rows.set(playerId, {
            playerId,
            name: player?.name || "Jogador removido",
            teamName: team?.name || "Sem time",
            P: 0,
            J: 0,
            V: 0,
            E: 0,
            D: 0,
            GP: 0,
            GC: 0,
            SG: 0
          });
        });

        state.groupMatches
          .filter((match) => match.groupId === groupId && match.saved)
          .forEach((match) => {
            const home = rows.get(match.homeId);
            const away = rows.get(match.awayId);
            if (!home || !away) return;
            home.J += 1;
            away.J += 1;
            home.GP += match.homeGoals;
            home.GC += match.awayGoals;
            away.GP += match.awayGoals;
            away.GC += match.homeGoals;
            if (match.homeGoals > match.awayGoals) {
              home.V += 1;
              home.P += 3;
              away.D += 1;
            } else if (match.homeGoals < match.awayGoals) {
              away.V += 1;
              away.P += 3;
              home.D += 1;
            } else {
              home.E += 1;
              away.E += 1;
              home.P += 1;
              away.P += 1;
            }
          });

        const list = Array.from(rows.values()).map((row) => ({ ...row, SG: row.GP - row.GC }));
        const matches = state.groupMatches.filter((match) => match.groupId === groupId);

        // Desempate: pontos, saldo, gols pró, confronto direto e ordem alfabética como fallback visual.
        return list.sort((a, b) => compareStandingRows(a, b, matches));
      }

      function compareStandingRows(a, b, matches) {
        if (b.P !== a.P) return b.P - a.P;
        if (b.SG !== a.SG) return b.SG - a.SG;
        if (b.GP !== a.GP) return b.GP - a.GP;
        const direct = compareDirect(a.playerId, b.playerId, matches);
        if (direct !== 0) return direct;
        return a.name.localeCompare(b.name, "pt-BR");
      }

      function compareDirect(playerA, playerB, matches) {
        const match = matches.find((item) => item.saved && (
          (item.homeId === playerA && item.awayId === playerB) ||
          (item.homeId === playerB && item.awayId === playerA)
        ));
        if (!match || match.homeGoals === match.awayGoals) return 0;
        const homeWon = match.homeGoals > match.awayGoals;
        const aIsHome = match.homeId === playerA;
        return (homeWon && aIsHome) || (!homeWon && !aIsHome) ? -1 : 1;
      }

      function hasUnresolvedTie(row, matches) {
        return matches.some((match) => {
          if (!match.saved || (match.homeId !== row.playerId && match.awayId !== row.playerId)) return false;
          const otherId = match.homeId === row.playerId ? match.awayId : match.homeId;
          const groupId = match.groupId;
          const otherRow = computeStandings(groupId).find((candidate) => candidate.playerId === otherId);
          if (!otherRow) return false;
          return row.P === otherRow.P && row.SG === otherRow.SG && row.GP === otherRow.GP && compareDirect(row.playerId, otherId, matches) === 0;
        });
      }

      function getQualifiedMap() {
        const map = new Map();
        getQualifiedList().forEach((entry) => {
          map.set(entry.playerId, entry);
        });
        return map;
      }

      function getQualifiedList() {
        if (!state.groups.length) return [];
        const topTwo = [];
        const thirds = [];
        state.groups.forEach((group, groupIndex) => {
          const standings = computeStandings(group.id);
          standings.forEach((row, index) => {
            const entry = {
              playerId: row.playerId,
              groupId: group.id,
              groupIndex,
              groupName: group.name,
              rank: index + 1,
              kind: index < 2 ? "direct" : "third",
              stats: row
            };
            if (index < 2) topTwo.push(entry);
            if (index === 2) thirds.push(entry);
          });
        });

        const target = nextPowerOfTwo(topTwo.length);
        const neededThirds = Math.max(0, target - topTwo.length);
        thirds.sort(compareQualificationEntries);
        return [...topTwo, ...thirds.slice(0, neededThirds)];
      }

      function compareQualificationEntries(a, b) {
        if (b.stats.P !== a.stats.P) return b.stats.P - a.stats.P;
        if (b.stats.SG !== a.stats.SG) return b.stats.SG - a.stats.SG;
        if (b.stats.GP !== a.stats.GP) return b.stats.GP - a.stats.GP;
        if (b.stats.V !== a.stats.V) return b.stats.V - a.stats.V;
        return a.stats.name.localeCompare(b.stats.name, "pt-BR");
      }

      function nextPowerOfTwo(number) {
        let power = 1;
        while (power < number) power *= 2;
        return power;
      }

      function generateKnockout() {
        if (!allGroupMatchesComplete()) {
          notify("Salve todos os jogos da fase de grupos antes do mata-mata.");
          return;
        }
        if (state.knockout && !confirm("Refazer o chaveamento apaga placares do mata-mata. Continuar?")) {
          return;
        }
        const qualifiers = getQualifiedList();
        if (qualifiers.length < 2) {
          notify("Ainda não há classificados suficientes.");
          return;
        }

        // Chaveamento: prioriza 1º x 2º de grupos diferentes; melhores 3ºs entram quando a conta pede.
        const pairs = buildFirstRoundPairs(qualifiers);
        const roundNames = roundNamesFor(pairs.length);
        const rounds = roundNames.map((name, roundIndex) => {
          const matchCount = pairs.length / (2 ** roundIndex);
          return {
            name,
            matches: Array.from({ length: matchCount }, (_, index) => {
              if (roundIndex === 0) {
                const [home, away] = pairs[index];
                return createKnockoutMatch(index, home, away, name === "Quartas");
              }
              return createKnockoutMatch(index, null, null, false);
            })
          };
        });

        state.knockout = {
          generatedAt: Date.now(),
          rounds,
          championId: null
        };
        state.activeTab = "knockout";
        saveState();
        render();
        notify("Mata-mata gerado.");
      }

      function buildFirstRoundPairs(qualifiers) {
        const firsts = qualifiers.filter((entry) => entry.rank === 1).sort((a, b) => a.groupIndex - b.groupIndex);
        const seconds = qualifiers.filter((entry) => entry.rank === 2).sort((a, b) => a.groupIndex - b.groupIndex);
        const thirds = qualifiers.filter((entry) => entry.rank === 3).sort(compareQualificationEntries);

        if (firsts.length === 4 && seconds.length === 4 && !thirds.length) {
          return [
            [firsts[0], seconds[1]],
            [firsts[2], seconds[3]],
            [firsts[1], seconds[0]],
            [firsts[3], seconds[2]]
          ];
        }

        if (firsts.length === 3 && seconds.length === 3 && thirds.length === 2) {
          return [
            [firsts[0], seconds[1] || seconds[0]],
            [firsts[1], seconds[2] || seconds[0]],
            [firsts[2], seconds[0]],
            [thirds[0], thirds[1]]
          ];
        }

        const pairs = [];
        const availableSeconds = [...seconds];
        firsts.forEach((first) => {
          const chosenIndex = availableSeconds.findIndex((second) => second.groupId !== first.groupId);
          if (chosenIndex >= 0) {
            pairs.push([first, availableSeconds.splice(chosenIndex, 1)[0]]);
          }
        });
        const leftovers = [...availableSeconds, ...thirds];
        while (leftovers.length >= 2) {
          const home = leftovers.shift();
          const awayIndex = leftovers.findIndex((entry) => entry.groupId !== home.groupId);
          const away = awayIndex >= 0 ? leftovers.splice(awayIndex, 1)[0] : leftovers.shift();
          pairs.push([home, away]);
        }
        return pairs;
      }

      function roundNamesFor(firstRoundMatchCount) {
        if (firstRoundMatchCount >= 4) return ["Quartas", "Semifinal", "Final"];
        if (firstRoundMatchCount === 2) return ["Semifinal", "Final"];
        return ["Final"];
      }

      function createKnockoutMatch(index, home, away, twoLegged = false) {
        return {
          id: uid("ko"),
          label: `Jogo ${index + 1}`,
          homeId: home?.playerId || null,
          awayId: away?.playerId || null,
          homeSeed: home ? seedLabel(home) : "",
          awaySeed: away ? seedLabel(away) : "",
          twoLegged,
          legs: blankKnockoutLegs(twoLegged),
          homeGoals: null,
          awayGoals: null,
          homePenalties: null,
          awayPenalties: null,
          winnerId: null,
          saved: false
        };
      }

      function seedLabel(entry) {
        if (!entry) return "";
        if (entry.kind === "third") return `Melhor 3º · Grupo ${entry.groupName}`;
        return `${entry.rank}º · Grupo ${entry.groupName}`;
      }

      function saveKnockoutMatch(roundIndex, matchIndex) {
        if (!state.knockout) return;
        const match = state.knockout.rounds[roundIndex]?.matches[matchIndex];
        if (!match || !match.homeId || !match.awayId) return;
        const twoLegged = isTwoLeggedKnockout(match, roundIndex);
        const legs = knockoutLegsForMatch(match, roundIndex).map((leg, legIndex) => ({
          label: leg.label,
          homeGoals: parseScore(document.getElementById(`ko-${match.id}-leg-${legIndex}-home`)?.value),
          awayGoals: parseScore(document.getElementById(`ko-${match.id}-leg-${legIndex}-away`)?.value)
        }));
        if (legs.some((leg) => leg.homeGoals === null || leg.awayGoals === null)) {
          notify(twoLegged ? "Informe os placares da ida e da volta." : "Informe o placar do jogo.");
          return;
        }

        const homeGoals = legs.reduce((sum, leg) => sum + leg.homeGoals, 0);
        const awayGoals = legs.reduce((sum, leg) => sum + leg.awayGoals, 0);
        let homePenalties = null;
        let awayPenalties = null;
        let winnerId = null;
        if (homeGoals > awayGoals) {
          winnerId = match.homeId;
        } else if (homeGoals < awayGoals) {
          winnerId = match.awayId;
        } else {
          homePenalties = parseOptionalScore(document.getElementById(`ko-${match.id}-home-pen`)?.value);
          awayPenalties = parseOptionalScore(document.getElementById(`ko-${match.id}-away-pen`)?.value);
          if (homePenalties === null || awayPenalties === null || homePenalties === awayPenalties) {
            notify(twoLegged ? "Empate no agregado precisa de pênaltis com vencedor." : "Empate no mata-mata precisa de pênaltis com vencedor.");
            return;
          }
          winnerId = homePenalties > awayPenalties ? match.homeId : match.awayId;
        }

        match.twoLegged = twoLegged;
        if (twoLegged) {
          match.legs = legs;
        } else {
          delete match.legs;
        }
        match.homeGoals = homeGoals;
        match.awayGoals = awayGoals;
        match.homePenalties = homePenalties;
        match.awayPenalties = awayPenalties;
        match.winnerId = winnerId;
        match.saved = true;
        propagateKnockout();
        saveState();
        render();
        notify(twoLegged ? "Quartas atualizadas pelo agregado." : "Mata-mata atualizado.");
      }

      function parseOptionalScore(value) {
        if (value === "" || value === null || value === undefined) return null;
        return parseScore(value);
      }

      function propagateKnockout() {
        if (!state.knockout) return;
        const rounds = state.knockout.rounds;
        for (let roundIndex = 1; roundIndex < rounds.length; roundIndex += 1) {
          const previous = rounds[roundIndex - 1].matches;
          rounds[roundIndex].matches.forEach((match, index) => {
            const homeId = previous[index * 2]?.winnerId || null;
            const awayId = previous[index * 2 + 1]?.winnerId || null;
            if (match.homeId !== homeId || match.awayId !== awayId) {
              const twoLegged = rounds[roundIndex].name === "Quartas";
              match.homeId = homeId;
              match.awayId = awayId;
              match.homeSeed = homeId ? "Vencedor anterior" : "";
              match.awaySeed = awayId ? "Vencedor anterior" : "";
              match.twoLegged = twoLegged;
              match.legs = blankKnockoutLegs(twoLegged);
              match.homeGoals = null;
              match.awayGoals = null;
              match.homePenalties = null;
              match.awayPenalties = null;
              match.winnerId = null;
              match.saved = false;
            }
          });
        }
        const finalRound = rounds[rounds.length - 1];
        const finalMatch = finalRound?.matches[0];
        state.knockout.championId = finalMatch?.saved ? finalMatch.winnerId : null;
      }

      function formatRules(text) {
        const clean = text.trim();
        if (!clean) {
          return `<div class="empty-state"><div><span class="empty-icon">${uiIcon("document")}</span><strong>As regras aparecerão aqui.</strong><br>Cole o texto no campo ao lado.</div></div>`;
        }
        return clean.split(/\n{2,}/).map((block) => {
          const lines = block.split("\n").map((line) => line.trim()).filter(Boolean);
          if (!lines.length) return "";
          if (/^#{1,3}\s/.test(lines[0])) {
            const title = lines[0].replace(/^#{1,3}\s*/, "");
            const rest = lines.slice(1).map((line) => `<p>${escapeHtml(line)}</p>`).join("");
            return `<h3>${escapeHtml(title)}</h3>${rest}`;
          }
          if (lines.every((line) => /^[-*•]\s+/.test(line))) {
            return `<ul>${lines.map((line) => `<li>${escapeHtml(line.replace(/^[-*•]\s+/, ""))}</li>`).join("")}</ul>`;
          }
          return `<p>${lines.map(escapeHtml).join("<br>")}</p>`;
        }).join("");
      }

      function exportData() {
        const payload = {
          app: "FUTFRALDA",
          version: 1,
          exportedAt: new Date().toISOString(),
          state
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `futfralda-backup-${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
      }

      function importData(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const parsed = JSON.parse(String(reader.result));
            const importedState = parsed.state || parsed;
            if (!Array.isArray(importedState.players)) throw new Error("Backup inválido");
            if (!confirm("Importar este JSON vai substituir o torneio atual. Continuar?")) return;
            state = normalizeState(importedState);
            saveState();
            revealCount = Infinity;
            clearInterval(revealTimer);
            render();
            notify("Backup importado.");
          } catch (error) {
            notify("Não consegui importar esse arquivo JSON.");
            console.warn(error);
          }
        };
        reader.readAsText(file);
      }

      function resetTournament() {
        if (!confirm("Resetar todo o FUTFRALDA? Isso apaga cadastro, sorteio, placares e regras.")) return;
        if (!confirm("Confirma mesmo? Essa ação não pode ser desfeita sem backup JSON.")) return;
        state = defaultState();
        localStorage.removeItem(STORAGE_KEY);
        revealCount = Infinity;
        clearInterval(revealTimer);
        render();
        notify("Torneio resetado.");
      }

      document.addEventListener("click", (event) => {
        const tabButton = event.target.closest("[data-tab]");
        if (tabButton) {
          state.activeTab = tabButton.dataset.tab;
          saveState();
          render();
          return;
        }

        const actionButton = event.target.closest("[data-action]");
        if (!actionButton || actionButton.disabled) return;
        const action = actionButton.dataset.action;
        if (action === "remove-player") removePlayer(actionButton.dataset.playerId);
        if (action === "toggle-team-exclusion") toggleTeamExclusion(actionButton.dataset.teamName);
        if (action === "draw-teams") drawTeams();
        if (action === "clear-draw") clearDraw();
        if (action === "generate-groups") {
          if (generateGroupsAndMatches()) {
            saveState();
            render();
            notify("Grupos gerados.");
          }
        }
        if (action === "save-group-match") saveGroupMatch(actionButton.dataset.matchId);
        if (action === "generate-knockout") generateKnockout();
        if (action === "save-ko-match") saveKnockoutMatch(Number(actionButton.dataset.round), Number(actionButton.dataset.matchIndex));
        if (action === "save-ranking-adjustment") saveRankingAdjustment();
        if (action === "reset-ranking-adjustment") resetRankingAdjustment();
        if (action === "reset-ranking-adjustments") resetRankingAdjustments();
        if (action === "export") exportData();
        if (action === "reset") resetTournament();
      });

      document.addEventListener("submit", (event) => {
        const form = event.target.closest("[data-form='add-player']");
        if (!form) return;
        event.preventDefault();
        addPlayer(new FormData(form).get("playerName") || "");
      });

      document.addEventListener("change", (event) => {
        const nameInput = event.target.closest("[data-player-name]");
        if (nameInput) {
          updatePlayerName(nameInput.dataset.playerName, nameInput.value);
          return;
        }
        const restrictedInput = event.target.closest("[data-player-restricted]");
        if (restrictedInput) {
          updateRestricted(restrictedInput.dataset.playerRestricted, restrictedInput.checked);
          return;
        }
        const seededInput = event.target.closest("[data-player-seeded]");
        if (seededInput) {
          updateSeeded(seededInput.dataset.playerSeeded, seededInput.checked);
          return;
        }
        const groupSelect = event.target.closest("[data-player-group]");
        if (groupSelect) {
          movePlayerToGroup(groupSelect.dataset.playerGroup, groupSelect.value);
          return;
        }
        const rankingPlayerSelect = event.target.closest("[data-ranking-editor-player]");
        if (rankingPlayerSelect) {
          selectRankingEditorPlayer(rankingPlayerSelect.value);
          return;
        }
        const importInput = event.target.closest("[data-action='import']");
        if (importInput) {
          importData(importInput.files[0]);
          importInput.value = "";
        }
      });

      document.addEventListener("input", (event) => {
        const scoreInput = event.target.closest("[data-score-kind]");
        if (scoreInput) {
          updateScoreDraft(scoreInput);
          return;
        }

        const rulesInput = event.target.closest("[data-rules-text]");
        if (!rulesInput) return;
        state.rulesText = rulesInput.value;
        saveState();
        const preview = document.getElementById("rulesPreview");
        if (preview) preview.innerHTML = formatRules(state.rulesText);
      });

      window.addEventListener("pagehide", () => {
        saveState();
      });

      render();
    })();
  </script>
</body>
</html>
